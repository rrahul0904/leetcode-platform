name: rigor-local

services:
  web:
    image: rigor-web:0.1.0-local
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    image: rigor-api:0.1.0-local
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      secrets:
        - build_ca
    environment:
      RIGOR_ENVIRONMENT: local
      RIGOR_CONTENT_ROOT: /app/content
      RIGOR_ALLOWED_ORIGINS: '["http://localhost:3001"]'
      RIGOR_LOCAL_OIDC_ENABLED: "true"
      RIGOR_OIDC_ISSUER: http://localhost:8002/local-oidc
      RIGOR_OIDC_AUDIENCE: rigor-web
      RIGOR_LOCAL_OIDC_REDIRECT_URIS: '["http://localhost:3001/auth/callback"]'
      RIGOR_DATABASE_URL: postgresql+psycopg://rigor:rigor_local_only@postgres:5432/rigor
    ports:
      - "8002:8002"
    secrets:
      - build_ca
    depends_on:
      local-release:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  migrate:
    image: rigor-api:0.1.0-local
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      secrets:
        - build_ca
    command: ["alembic", "upgrade", "head"]
    environment:
      RIGOR_DATABASE_URL: postgresql+psycopg://rigor:rigor_local_only@postgres:5432/rigor
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  seed:
    image: rigor-api:0.1.0-local
    command: ["python", "/app/scripts/seed_database.py"]
    environment:
      RIGOR_SEED_DATABASE_URL: postgresql://rigor:rigor_local_only@postgres:5432/rigor
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  catalog:
    profiles: ["catalog"]
    image: rigor-api:0.1.0-local
    command:
      [
        "python",
        "/app/scripts/collect_external_references.py",
        "--ca-file",
        "/run/secrets/build_ca",
      ]
    environment:
      RIGOR_DATABASE_URL: postgresql+psycopg://rigor:rigor_local_only@postgres:5432/rigor
    secrets:
      - build_ca
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  catalog-init:
    image: rigor-api:0.1.0-local
    command:
      [
        "python",
        "/app/scripts/collect_external_references.py",
        "--ca-file",
        "/run/secrets/build_ca",
      ]
    environment:
      RIGOR_DATABASE_URL: postgresql+psycopg://rigor:rigor_local_only@postgres:5432/rigor
    secrets:
      - build_ca
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  content-sync:
    image: rigor-api:0.1.0-local
    command:
      [
        "python",
        "/app/scripts/sync_content.py",
        "--mode",
        "sync",
        "--report",
        "/tmp/content-sync-report.json",
      ]
    environment:
      RIGOR_ENVIRONMENT: local
      RIGOR_CONTENT_ROOT: /app/content
      RIGOR_DATABASE_URL: postgresql+psycopg://rigor:rigor_local_only@postgres:5432/rigor
    depends_on:
      catalog-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  local-release:
    image: rigor-api:0.1.0-local
    command: ["python", "/app/scripts/publish_local_catalog.py"]
    environment:
      RIGOR_ENVIRONMENT: local
      RIGOR_CONTENT_ROOT: /app/content
      RIGOR_DATABASE_URL: postgresql+psycopg://rigor:rigor_local_only@postgres:5432/rigor
    depends_on:
      content-sync:
        condition: service_completed_successfully
    read_only: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  postgres:
    image: pgvector/pgvector:0.8.1-pg18-trixie@sha256:2fd905ba95f99a51be207d0ff0b8d5b8538cbce7e9083b3ccfa65b93bb28b938
    environment:
      POSTGRES_DB: rigor
      POSTGRES_USER: rigor
      POSTGRES_PASSWORD: rigor_local_only
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rigor -d rigor"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - rigor-postgres:/var/lib/postgresql
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  valkey:
    image: valkey/valkey:8.1.3-bookworm@sha256:fea8b3e67b15729d4bb70589eb03367bab9ad1ee89c876f54327fc7c6e618571
    user: "999:999"
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--dir", "/tmp"]
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  rigor-postgres:

secrets:
  build_ca:
    file: infra/certs/local-build-ca.pem
