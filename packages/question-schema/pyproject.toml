[project]
name = "rigor-question-schema"
version = "0.1.0"
description = "Canonical Pydantic schemas for Rigor content"
requires-python = ">=3.13,<3.14"
dependencies = ["pydantic==2.13.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rigor_question_schema"]

