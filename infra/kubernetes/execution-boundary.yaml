apiVersion: v1
kind: Namespace
metadata:
  name: rigor-execution
  labels:
    app.kubernetes.io/part-of: rigor
    rigor.io/trust-plane: untrusted-execution
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: candidate-execution
  namespace: rigor-execution
  labels:
    app.kubernetes.io/part-of: rigor
automountServiceAccountToken: false
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
scheduling:
  nodeSelector:
    rigor.io/gvisor: "true"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: rigor-execution
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: execution-namespace-quota
  namespace: rigor-execution
spec:
  hard:
    requests.cpu: "100"
    requests.memory: 100Gi
    limits.cpu: "250"
    limits.memory: 250Gi
    pods: "500"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: candidate-container-limits
  namespace: rigor-execution
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: "1"
        memory: 512Mi
      max:
        cpu: "2"
        memory: 1536Mi
        ephemeral-storage: 256Mi
