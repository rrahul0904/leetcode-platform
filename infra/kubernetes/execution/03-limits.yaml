apiVersion: v1
kind: LimitRange
metadata:
  name: sandbox-defaults
  namespace: rigor-execution
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 64Mi
      default:
        cpu: "1"
        memory: 256Mi
        ephemeral-storage: 128Mi
      max:
        cpu: "2"
        memory: 1Gi
        ephemeral-storage: 512Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandbox-capacity
  namespace: rigor-execution
spec:
  hard:
    count/jobs.batch: "500"
    count/pods: "600"
    requests.cpu: "40"
    requests.memory: 80Gi
    limits.cpu: "160"
    limits.memory: 160Gi
    requests.ephemeral-storage: 80Gi
    limits.ephemeral-storage: 160Gi
