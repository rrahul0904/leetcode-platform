apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
scheduling:
  nodeSelector:
    rigor.dev/workload: untrusted-execution
    rigor.dev/runtime: gvisor
  tolerations:
    - key: rigor.dev/untrusted-execution
      operator: Equal
      value: "true"
      effect: NoSchedule
