name: Source history exact-match recovery

on:
  push:
    branches:
      - agent/source-backed-question-bank

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Scan public repository history for reviewed source fingerprints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import pathlib
          import shutil
          import subprocess
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          root = pathlib.Path("/tmp/source-recovery")
          shutil.rmtree(root, ignore_errors=True)
          root.mkdir(parents=True)
          code_suffixes = {".py", ".cpp", ".cc", ".cxx", ".c++", ".c", ".java", ".js", ".ts", ".go", ".kt", ".cs", ".dart"}

          def api_search(query):
              url = "https://api.github.com/search/repositories?" + urllib.parse.urlencode({"q": query, "per_page": 100})
              request = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)["items"]

          def run(*args, cwd=None):
              return subprocess.run(args, cwd=cwd, check=True, text=True, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL).stdout

          def counts(tree, repo):
              names = [line for line in run("git", "ls-tree", "-r", "--name-only", tree, cwd=repo).splitlines() if line]
              dirs = set()
              for name in names:
                  parts = pathlib.PurePosixPath(name).parts[:-1]
                  for i in range(1, len(parts) + 1):
                      dirs.add("/".join(parts[:i]))
              code = sum(pathlib.PurePosixPath(name).suffix.lower() in code_suffixes for name in names)
              cpp = sum(pathlib.PurePosixPath(name).suffix.lower() in {".cpp", ".cc", ".cxx", ".c++"} for name in names)
              js = sum(pathlib.PurePosixPath(name).suffix.lower() in {".js", ".ts"} for name in names)
              return len(names), len(dirs), code, cpp, js

          def scan(label, query, target_files, target_code=None, target_cpp=None, target_raw=None, limit=100):
              print(f"=== {label} ===")
              candidates = api_search(query)
              seen = 0
              matches = []
              for item in candidates:
                  if item.get("default_branch") != "master":
                      continue
                  if seen >= limit:
                      break
                  seen += 1
                  full = item["full_name"]
                  repo = root / (full.replace("/", "__"))
                  print(f"SCAN {full} size_kb={item.get('size')}")
                  try:
                      subprocess.run(["git", "clone", "--quiet", "--filter=blob:none", "--no-checkout", item["clone_url"], str(repo)], check=True, timeout=180)
                      commits = run("git", "rev-list", "--all", cwd=repo).splitlines()
                      trees = []
                      seen_trees = set()
                      for commit in commits:
                          tree = run("git", "show", "-s", "--format=%T", commit, cwd=repo).strip()
                          if tree and tree not in seen_trees:
                              seen_trees.add(tree)
                              trees.append((commit, tree))
                      for commit, tree in trees:
                          files, dirs, code, cpp, js = counts(tree, repo)
                          if files != target_files:
                              continue
                          raw_options = {files + dirs, files + dirs + 1}
                          if target_raw is not None and target_raw not in raw_options:
                              continue
                          if target_code is not None and code != target_code:
                              continue
                          if target_cpp is not None and cpp != target_cpp:
                              continue
                          hit = {"repository": full, "commit": commit, "tree": tree, "files": files, "dirs": dirs, "raw_options": sorted(raw_options), "code": code, "cpp": cpp, "js_ts": js}
                          matches.append(hit)
                          print("EXACT_MATCH " + json.dumps(hit, sort_keys=True))
                  except Exception as exc:
                      print(f"SKIP {full}: {type(exc).__name__}: {exc}")
                  finally:
                      shutil.rmtree(repo, ignore_errors=True)
              print("MATCHES " + json.dumps(matches, sort_keys=True))
              return matches

          js_matches = scan(
              "MIT JavaScript LeetCode-Solutions",
              "LeetCode-Solutions in:name language:JavaScript license:mit pushed:<2026-08-01",
              target_files=222,
              target_code=210,
              target_raw=288,
              limit=100,
          )
          cp_matches = scan(
              "Competitive Programming C++",
              "Competitive-Programming in:name language:C++ pushed:<2026-08-01 size:5000..100000",
              target_files=224,
              target_cpp=149,
              target_raw=470,
              limit=60,
          )
          print("FINAL " + json.dumps({"javascript": js_matches, "competitive_programming": cp_matches}, sort_keys=True))
          PY
