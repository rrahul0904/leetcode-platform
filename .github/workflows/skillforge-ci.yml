name: SkillForge CI
on:
  pull_request:
    paths:
      - 'skillforge-ai/**'
      - '.github/workflows/skillforge-ci.yml'
  push:
    branches: ['feature/skillforge-ai-supabase-demo']
    paths:
      - 'skillforge-ai/**'
      - '.github/workflows/skillforge-ci.yml'

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skillforge-ai/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skillforge-ai/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python -m py_compile app/main.py
      - run: python -m pytest -q
