name: Temporary Next security lock refresh

on:
  push:
    branches:
      - codex/skillforge-production-reconstruction-v2

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/skillforge-production-reconstruction-v2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: pnpm

      - name: Refresh patched Next.js dependency and lockfile
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @rigor/web up next@16.3.8 eslint-config-next@16.3.8 --lockfile-only
          grep -q 'next:' apps/web/package.json
          grep -q '16.3.8' apps/web/package.json
          grep -q 'next@16.3.8' pnpm-lock.yaml

      - name: Commit deterministic security refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git commit -m 'fix(security): upgrade Next.js to 16.3.8'
          git push origin HEAD:codex/skillforge-production-reconstruction-v2
