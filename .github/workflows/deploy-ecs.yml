name: Deploy SkillForge ECS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub deployment environment
        required: true
        default: production
        type: choice
        options: [development, production]

permissions:
  contents: read
  id-token: write

concurrency:
  group: skillforge-ecs-${{ inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_API_SERVICE: ${{ vars.ECS_API_SERVICE }}
  ECS_WORKER_SERVICE: ${{ vars.ECS_WORKER_SERVICE }}
  ECR_API_REPOSITORY: ${{ vars.ECR_API_REPOSITORY }}
  ECR_WORKER_REPOSITORY: ${{ vars.ECR_WORKER_REPOSITORY }}
  AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate production deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in AWS_REGION ECS_CLUSTER ECS_API_SERVICE ECS_WORKER_SERVICE ECR_API_REPOSITORY ECR_WORKER_REPOSITORY AWS_DEPLOY_ROLE_ARN; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions variable: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "ECS deployment configuration is incomplete; no AWS mutation has occurred."
            exit 1
          fi

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build and push API image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --secret id=build_ca,src=/etc/ssl/certs/ca-certificates.crt \
            -t "$REGISTRY/$ECR_API_REPOSITORY:$IMAGE_TAG" \
            -f infra/docker/api.Dockerfile .
          docker push "$REGISTRY/$ECR_API_REPOSITORY:$IMAGE_TAG"
          echo "API_IMAGE=$REGISTRY/$ECR_API_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Build and push trusted background worker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --secret id=build_ca,src=/etc/ssl/certs/ca-certificates.crt \
            -t "$REGISTRY/$ECR_WORKER_REPOSITORY:$IMAGE_TAG" \
            -f services/background-worker/Dockerfile .
          docker push "$REGISTRY/$ECR_WORKER_REPOSITORY:$IMAGE_TAG"
          echo "WORKER_IMAGE=$REGISTRY/$ECR_WORKER_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Read current task definitions from deployed services
        shell: bash
        run: |
          set -euo pipefail
          api_task_definition="$(aws ecs describe-services             --cluster "$ECS_CLUSTER"             --services "$ECS_API_SERVICE"             --query 'services[0].taskDefinition'             --output text)"
          worker_task_definition="$(aws ecs describe-services             --cluster "$ECS_CLUSTER"             --services "$ECS_WORKER_SERVICE"             --query 'services[0].taskDefinition'             --output text)"

          for value in "$api_task_definition" "$worker_task_definition"; do
            if [ -z "$value" ] || [ "$value" = "None" ]; then
              echo "Could not resolve the current ECS task definition from service state."
              exit 1
            fi
          done

          aws ecs describe-task-definition --task-definition "$api_task_definition" --query taskDefinition > api-task.json
          aws ecs describe-task-definition --task-definition "$worker_task_definition" --query taskDefinition > worker-task.json
          for file in api-task.json worker-task.json; do
            jq 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' "$file" > "$file.clean"
            mv "$file.clean" "$file"
          done

      - name: Render API task definition
        id: api-task
        uses: aws-actions/amazon-ecs-render-task-definition@138c24f321fdbdf7edee4a685519d253cae2cdea # v1.9.0
        with:
          task-definition: api-task.json
          container-name: api
          image: ${{ env.API_IMAGE }}

      - name: Deploy API
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2.6.3
        with:
          task-definition: ${{ steps.api-task.outputs.task-definition }}
          service: ${{ env.ECS_API_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Render background worker task definition
        id: worker-task
        uses: aws-actions/amazon-ecs-render-task-definition@138c24f321fdbdf7edee4a685519d253cae2cdea # v1.9.0
        with:
          task-definition: worker-task.json
          container-name: worker
          image: ${{ env.WORKER_IMAGE }}

      - name: Deploy background worker
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2.6.3
        with:
          task-definition: ${{ steps.worker-task.outputs.task-definition }}
          service: ${{ env.ECS_WORKER_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Verify stable ECS service state
        shell: bash
        run: |
          set -euo pipefail
          verify_service() {
            service="$1"
            running="$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$service" --query 'services[0].runningCount' --output text)"
            desired="$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$service" --query 'services[0].desiredCount' --output text)"
            rollout="$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$service" --query 'services[0].deployments[?status==`PRIMARY`].rolloutState | [0]' --output text)"
            status="$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$service" --query 'services[0].status' --output text)"

            echo "$service status=$status running=$running desired=$desired rollout=$rollout"
            test "$status" = "ACTIVE"
            test "$desired" -ge 1
            test "$running" -eq "$desired"
            test "$rollout" = "COMPLETED"
          }

          verify_service "$ECS_API_SERVICE"
          verify_service "$ECS_WORKER_SERVICE"
