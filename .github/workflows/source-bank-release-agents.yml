name: Source-bank release agents

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-bank-release-agents-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Multi-agent blocked-gate audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          enable-cache: true

      - name: Install locked Python workspace
        run: uv sync --frozen --all-packages

      - name: Run release agents in audit mode
        run: |
          uv run python scripts/source_bank_release_agents.py \
            --work .work/source-bank-release-agents

      - name: Require agent execution without false release failures
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path('.work/source-bank-release-agents/report.json').read_text()
          )
          status = report['overall_status']
          if status == 'FAIL':
              raise SystemExit('multi-agent audit contains a hard failure')
          if status not in {'PASS', 'BLOCKED'}:
              raise SystemExit(f'unexpected multi-agent status: {status!r}')

          print(f"overall={status}")
          for name, agent in sorted(report['agents'].items()):
              print(f"{name}={agent['status']}")
          PY

      - name: Publish job summary
        if: always()
        run: |
          if [ -f .work/source-bank-release-agents/report.json ]; then
            uv run python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          report = json.loads(
              Path('.work/source-bank-release-agents/report.json').read_text()
          )
          print('## Source-bank release agents')
          print()
          print(f"Overall: **{report['overall_status']}**")
          print()
          print('| Agent | Status | Summary |')
          print('|---|---|---|')
          for name, agent in sorted(report['agents'].items()):
              summary = str(agent['summary']).replace('|', '\\|')
              print(f"| {name} | {agent['status']} | {summary} |")
          PY
          fi

      - name: Upload agent evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: source-bank-release-agent-report
          path: .work/source-bank-release-agents/*.json
          if-no-files-found: error
          retention-days: 14
