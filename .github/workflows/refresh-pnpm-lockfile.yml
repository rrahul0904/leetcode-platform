name: Refresh pnpm lockfile

on:
  push:
    branches:
      - agent/skillforge-reconstruction
    paths:
      - pnpm-workspace.yaml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: agent/skillforge-reconstruction
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Enable pnpm
        run: corepack enable

      - name: Refresh lockfile
        run: pnpm install --lockfile-only

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "Refresh pnpm lockfile for security overrides"
          git push origin HEAD:agent/skillforge-reconstruction
