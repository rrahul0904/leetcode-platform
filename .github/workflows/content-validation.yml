name: Content validation

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: content-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: Native package schema and reference tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked Python workspace
        run: uv sync --frozen --all-packages

      - name: Validate native question packages and reference implementations
        run: make test-content
