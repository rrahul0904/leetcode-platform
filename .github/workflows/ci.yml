name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint, types, tests, and database integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked Python workspace
        run: uv sync --frozen --all-packages
      - name: Validate Docker Compose test fixture
        run: docker compose config --quiet
      - name: Start PostgreSQL 18 + pgvector test fixture
        run: docker compose up -d --wait postgres
      - name: Upgrade integration-test database
        env:
          RIGOR_DATABASE_URL: postgresql+psycopg://rigor_migrator:rigor_migrator_local_only@localhost:5434/rigor
        run: uv run alembic upgrade head
      - name: Seed deterministic taxonomy for integration tests
        env:
          RIGOR_SEED_DATABASE_URL: postgresql://rigor_migrator:rigor_migrator_local_only@localhost:5434/rigor
          PGOPTIONS: -c rigor.maintenance_bypass=on
        run: uv run python scripts/seed_database.py
      - name: Ruff
        run: >-
          uv run ruff check
          apps/api/src
          packages/question-schema/src
          services/python-runner
          services/sql-runner
          scripts
          apps/api/tests
          packages/question-schema/tests
          tests
      - name: Pyright
        if: always()
        run: uv run pyright apps/api/src packages/question-schema/src scripts
      - name: Pytest
        if: always()
        run: uv run pytest -q
      - name: Show PostgreSQL logs on failure
        if: failure()
        run: docker compose logs postgres
      - name: Stop integration-test services
        if: always()
        run: docker compose down -v

  web:
    name: Web lint, types, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: pnpm
      - name: Install locked JavaScript workspace
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @rigor/web lint
      - name: Typecheck
        if: always()
        run: pnpm --filter @rigor/web typecheck
      - name: Test
        if: always()
        run: pnpm --filter @rigor/web test
      - name: Build
        if: always()
        run: pnpm --filter @rigor/web build

  migration:
    name: PostgreSQL migration cycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked Python workspace
        run: uv sync --frozen --all-packages
      - name: Validate Docker Compose test fixture
        run: docker compose config --quiet
      - name: Start PostgreSQL 18 + pgvector test fixture
        run: docker compose up -d --wait postgres
      - name: Upgrade from empty database
        env:
          RIGOR_DATABASE_URL: postgresql+psycopg://rigor_migrator:rigor_migrator_local_only@localhost:5434/rigor
        run: uv run alembic upgrade head
      - name: Verify execution, knowledge, SaaS, and CareerOS schemas
        run: |
          test "$(docker compose exec -T postgres psql -U rigor -d rigor -tAc "SELECT version_num FROM alembic_version")" = "20260830_0019"
          test "$(docker compose exec -T postgres psql -U rigor -d rigor -tAc "SELECT to_regclass('public.execution_outbox') IS NOT NULL")" = "t"
          test "$(docker compose exec -T postgres psql -U rigor -d rigor -tAc "SELECT to_regclass('public.execution_payloads') IS NOT NULL")" = "t"
          test "$(docker compose exec -T postgres psql -U rigor -d rigor -tAc "SELECT to_regclass('public.execution_public_results') IS NOT NULL")" = "t"
          test "$(docker compose exec -T postgres psql -U rigor -d rigor -tAc "SELECT to_regclass('public.knowledge_problems') IS NOT NULL")" = "t"
          test "$(docker compose exec -T postgres psql -U rigor -d rigor -tAc "SELECT to_regclass('public.knowledge_solutions') IS NOT NULL")" = "t"
          test "$(docker compose exec -T postgres psql -U rigor -d rigor -tAc "SELECT to_regclass('public.knowledge_company_observations') IS NOT NULL")" = "t"
          test "$(docker compose exec -T postgres psql -U rigor -d rigor -tAc "SELECT to_regclass('public.knowledge_candidate_problem_state') IS NOT NULL")" = "t"
          test "$(docker compose exec -T postgres psql -U rigor -d rigor -tAc "SELECT to_regclass('public.local_execution_queue') IS NOT NULL")" = "t"
          test "$(docker compose exec -T postgres psql -U rigor -d rigor -tAc "SELECT to_regclass('public.local_execution_controller_status') IS NOT NULL")" = "t"
          test "$(docker compose exec -T postgres psql -U rigor -d rigor -tAc "SELECT to_regclass('public.user_preferences') IS NOT NULL")" = "t"
          test "$(docker compose exec -T postgres psql -U rigor -d rigor -tAc "SELECT to_regclass('public.identity_webhook_events') IS NOT NULL")" = "t"
          test "$(docker compose exec -T postgres psql -U rigor -d rigor -tAc "SELECT to_regclass('public.login_events') IS NOT NULL")" = "t"
          test "$(docker compose exec -T postgres psql -U rigor -d rigor -tAc "SELECT to_regclass('public.candidate_files') IS NOT NULL")" = "t"
          test "$(docker compose exec -T postgres psql -U rigor -d rigor -tAc "SELECT to_regclass('public.subscriptions') IS NOT NULL")" = "t"
          test "$(docker compose exec -T postgres psql -U rigor -d rigor -tAc "SELECT to_regclass('public.candidate_question_bookmarks') IS NOT NULL")" = "t"
          test "$(docker compose exec -T postgres psql -U rigor -d rigor -tAc "SELECT to_regclass('public.candidate_question_notes') IS NOT NULL")" = "t"
          test "$(docker compose exec -T postgres psql -U rigor -d rigor -tAc "SELECT to_regclass('public.career_documents') IS NOT NULL")" = "t"
          test "$(docker compose exec -T postgres psql -U rigor -d rigor -tAc "SELECT to_regclass('public.career_jobs') IS NOT NULL")" = "t"
          test "$(docker compose exec -T postgres psql -U rigor -d rigor -tAc "SELECT to_regclass('public.career_job_analyses') IS NOT NULL")" = "t"
          test "$(docker compose exec -T postgres psql -U rigor -d rigor -tAc "SELECT relrowsecurity AND relforcerowsecurity FROM pg_class WHERE oid='candidate_files'::regclass")" = "t"
          test "$(docker compose exec -T postgres psql -U rigor -d rigor -tAc "SELECT relrowsecurity AND relforcerowsecurity FROM pg_class WHERE oid='candidate_question_bookmarks'::regclass")" = "t"
          test "$(docker compose exec -T postgres psql -U rigor -d rigor -tAc "SELECT relrowsecurity AND relforcerowsecurity FROM pg_class WHERE oid='candidate_question_notes'::regclass")" = "t"
          test "$(docker compose exec -T postgres psql -U rigor -d rigor -tAc "SELECT relrowsecurity AND relforcerowsecurity FROM pg_class WHERE oid='career_documents'::regclass")" = "t"
          test "$(docker compose exec -T postgres psql -U rigor -d rigor -tAc "SELECT relrowsecurity AND relforcerowsecurity FROM pg_class WHERE oid='career_jobs'::regclass")" = "t"
          test "$(docker compose exec -T postgres psql -U rigor -d rigor -tAc "SELECT relrowsecurity AND relforcerowsecurity FROM pg_class WHERE oid='career_job_analyses'::regclass")" = "t"
          test "$(docker compose exec -T postgres psql -U rigor -d rigor -tAc "SELECT relrowsecurity AND relforcerowsecurity FROM pg_class WHERE oid='knowledge_candidate_problem_state'::regclass")" = "t"
          test "$(docker compose exec -T postgres psql -U rigor -d rigor -tAc "SELECT relrowsecurity AND relforcerowsecurity FROM pg_class WHERE oid='knowledge_activity_events'::regclass")" = "t"
          test "$(docker compose exec -T postgres psql -U rigor -d rigor -tAc "SELECT relrowsecurity AND relforcerowsecurity FROM pg_class WHERE oid='local_execution_queue'::regclass")" = "t"
          test "$(docker compose exec -T postgres psql -U rigor -d rigor -tAc "SELECT NOT rolbypassrls FROM pg_roles WHERE rolname='rigor_execution_worker'")" = "t"
          test "$(docker compose exec -T postgres psql -U rigor -d rigor -tAc "SELECT NOT rolbypassrls FROM pg_roles WHERE rolname='rigor_execution_reconciler'")" = "t"
          test "$(docker compose exec -T postgres psql -U rigor -d rigor -tAc "SELECT NOT rolbypassrls FROM pg_roles WHERE rolname='rigor_executor'")" = "t"
      - name: Downgrade and re-upgrade SaaS and CareerOS migrations
        env:
          RIGOR_DATABASE_URL: postgresql+psycopg://rigor_migrator:rigor_migrator_local_only@localhost:5434/rigor
        run: |
          uv run alembic downgrade 20260824_0016
          uv run alembic upgrade head
      - name: Show PostgreSQL logs on failure
        if: failure()
        run: docker compose logs postgres
      - name: Stop services
        if: always()
        run: docker compose down -v

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.4"
      - name: Terraform format
        run: terraform fmt -check -diff -recursive infra/terraform
      - name: Initialize staging without remote backend
        if: always()
        run: terraform -chdir=infra/terraform/environments/staging init -backend=false -input=false
      - name: Validate staging source
        if: always()
        run: terraform -chdir=infra/terraform/environments/staging validate

  packer:
    name: gVisor execution-node AMI source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Packer
        uses: hashicorp/setup-packer@v3.2.0
        with:
          version: "1.16.0"
      - name: Initialize Packer plugins
        run: packer init infra/packer
      - name: Validate Packer syntax
        run: packer validate -syntax-only infra/packer
      - name: Validate gVisor installer shell
        run: bash -n infra/packer/scripts/install-gvisor.sh