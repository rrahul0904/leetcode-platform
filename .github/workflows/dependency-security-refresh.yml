name: Temporary dependency security refresh

on:
  push:
    branches:
      - agent/launch-assurance-hardening
    paths:
      - ".github/workflows/dependency-security-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/launch-assurance-hardening
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: pnpm
      - name: Refresh vulnerable web dependency graph
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @rigor/web update next@16.3.5 eslint-config-next@16.3.5 --save-exact --lockfile-only
          pnpm audit --fix --audit-level high || true
          pnpm install --frozen-lockfile
          pnpm --filter @rigor/web lint
          pnpm --filter @rigor/web typecheck
          pnpm --filter @rigor/web test
          pnpm --filter @rigor/web build
      - name: Commit canonical dependency refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json apps/web/package.json pnpm-lock.yaml pnpm-workspace.yaml
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "fix: patch launch-blocking web vulnerabilities"
          git push origin HEAD:agent/launch-assurance-hardening
