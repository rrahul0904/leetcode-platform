name: Deploy existing SkillForge production

on:
  workflow_dispatch:
  push:
    branches:
      - agent/vercel-clean-skillforge
      - agent/layrs-ai-tutor
    paths:
      - .github/workflows/deploy-vercel-skillforge.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: skillforge-interactive-demo-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_zmEezpOKGZy2sH5nqTfO44LD
  VERCEL_PROJECT_ID: prj_fnbuYcKQeKrEq5Sax2uWdTg2SHqT
  VERCEL_PROJECT_NAME: skillforge-interactive-demo
  PRODUCTION_URL: https://skillforge-interactive-demo.vercel.app
  EXPECTED_ALEMBIC_HEAD: 20260911_0019
  EXPECTED_LAUNCH_PACKAGES: "50"

jobs:
  release:
    name: Build, migrate, deploy API + web, and verify production
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout deployment commit
        uses: actions/checkout@v4

      - name: Require production deployment credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN GitHub Actions secret is not configured."
            echo "Production has not been modified."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.7.0

      - name: Link exact existing Vercel project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' \
            "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

          project_json="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")"
          actual_id="$(python -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<<"$project_json")"
          actual_name="$(python -c 'import json,sys; print(json.load(sys.stdin)["name"])' <<<"$project_json")"
          test "$actual_id" = "$VERCEL_PROJECT_ID"
          test "$actual_name" = "$VERCEL_PROJECT_NAME"
          echo "Release target verified: $actual_name ($actual_id)."

      - name: Pull and validate existing production environment
        shell: bash
        run: |
          set -euo pipefail
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          set -a
          source .vercel/.env.production.local
          set +a

          database_url="${RIGOR_DATABASE_URL:-${POSTGRES_URL:-}}"
          missing=0
          for name in NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY CLERK_SECRET_KEY RIGOR_BACKEND_ORIGIN; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required production variable: $name"
              missing=1
            fi
          done
          if [ -z "$database_url" ]; then
            echo "Missing required production database URL."
            missing=1
          fi
          test "$missing" -eq 0

          case "$RIGOR_BACKEND_ORIGIN" in
            http://localhost*|http://127.*|https://localhost*|https://127.*)
              echo "Refusing production release with local backend origin: $RIGOR_BACKEND_ORIGIN"
              exit 1
              ;;
          esac

          clerk_domain="$(python -c 'import base64,sys; key=sys.argv[1]; prefixes=("pk_test_","pk_live_"); encoded=next((key[len(p):] for p in prefixes if key.startswith(p)), None); encoded or (_ for _ in ()).throw(SystemExit("Unsupported Clerk publishable key format")); encoded += "=" * (-len(encoded) % 4); print(base64.urlsafe_b64decode(encoded).decode("utf-8").rstrip("$"))' "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY")"
          clerk_issuer="https://$clerk_domain"

          set_env() {
            key="$1"
            value="$2"
            printf '%s' "$value" | vercel env add "$key" production --force --yes --token="$VERCEL_TOKEN" >/dev/null
          }

          set_env RIGOR_CLERK_ISSUER "$clerk_issuer"
          set_env RIGOR_CLERK_JWKS_URL "$clerk_issuer/.well-known/jwks.json"
          set_env RIGOR_DATABASE_URL "$database_url"
          set_env POSTGRES_URL "${POSTGRES_URL:-$database_url}"
          set_env NEXT_PUBLIC_APP_URL "$PRODUCTION_URL"
          set_env NEXT_PUBLIC_RIGOR_AUTH_MODE "clerk"
          set_env NEXT_PUBLIC_RIGOR_API_URL "/api/backend"
          set_env RIGOR_ALLOWED_ORIGINS "[\"$PRODUCTION_URL\"]"

      - name: Re-pull aligned production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Install locked Python workspace
        run: uv sync --frozen --all-packages

      - name: Validate source-controlled launch corpus
        shell: bash
        run: |
          set -euo pipefail
          output="$(uv run python scripts/validate_content.py)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q "$EXPECTED_LAUNCH_PACKAGES schema-complete package(s)"

      - name: Build production web artifact before database mutation
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Upgrade production database and verify launch content
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .vercel/.env.production.local
          set +a

          raw_database_url="${RIGOR_DATABASE_URL:-${POSTGRES_URL:-}}"
          case "$raw_database_url" in
            postgres://*)
              export RIGOR_DATABASE_URL="postgresql+psycopg://${raw_database_url#postgres://}"
              ;;
            postgresql://*)
              export RIGOR_DATABASE_URL="postgresql+psycopg://${raw_database_url#postgresql://}"
              ;;
            postgresql+psycopg://*)
              export RIGOR_DATABASE_URL="$raw_database_url"
              ;;
            *)
              echo "Unsupported production database URL scheme."
              exit 1
              ;;
          esac

          current_head="$(uv run python -c 'import os; from sqlalchemy import create_engine,text; e=create_engine(os.environ["RIGOR_DATABASE_URL"]); c=e.connect(); print(c.execute(text("SELECT version_num FROM alembic_version")).scalar_one()); c.close(); e.dispose()')"
          case "$current_head" in
            20260801_0012|20260801_0013|20260801_0014|20260802_0015|20260824_0016|20260826_0017|20260828_0018|20260911_0019)
              echo "Production migration preflight accepted current head: $current_head"
              ;;
            *)
              echo "Refusing to migrate unexpected production Alembic head: $current_head"
              exit 1
              ;;
          esac

          uv run alembic upgrade head
          actual_head="$(uv run python -c 'import os; from sqlalchemy import create_engine,text; e=create_engine(os.environ["RIGOR_DATABASE_URL"]); c=e.connect(); print(c.execute(text("SELECT version_num FROM alembic_version")).scalar_one()); c.close(); e.dispose()')"
          test "$actual_head" = "$EXPECTED_ALEMBIC_HEAD"

          # 0017 predated production Clerk rollout. Repair only stable Clerk user IDs.
          uv run python -c 'import os; from sqlalchemy import create_engine,text; e=create_engine(os.environ["RIGOR_DATABASE_URL"]); c=e.connect(); c.execute(text("UPDATE users SET auth_provider=:provider, updated_at=CURRENT_TIMESTAMP WHERE identity_subject LIKE :pattern AND auth_provider<>:provider"), {"provider":"clerk","pattern":"user_%"}); c.commit(); c.close(); e.dispose()'

          seed_url="${POSTGRES_URL:-$raw_database_url}"
          RIGOR_SEED_DATABASE_URL="$seed_url" uv run python scripts/seed_database.py
          uv run python scripts/sync_content.py --mode sync --report reports/production-content-sync.json
          RIGOR_ENVIRONMENT=production \
          RIGOR_PRODUCTION_LAUNCH_BOOTSTRAP_ENABLED=true \
          RIGOR_PRODUCTION_LAUNCH_BOOTSTRAP_REASON="Audited SkillForge release from commit $GITHUB_SHA" \
            uv run python scripts/publish_production_launch_catalog.py \
            | tee reports/production-launch-bootstrap.json

          published_count="$(uv run python -c 'import os; from sqlalchemy import create_engine,text; e=create_engine(os.environ["RIGOR_DATABASE_URL"]); c=e.connect(); print(c.execute(text("SELECT count(*) FROM questions q JOIN question_versions v ON v.id=q.current_published_version_id WHERE v.state=CAST(:state AS content_state)"), {"state":"published"}).scalar_one()); c.close(); e.dispose()')"
          tutor_tables="$(uv run python -c 'import os; from sqlalchemy import create_engine,text; e=create_engine(os.environ["RIGOR_DATABASE_URL"]); c=e.connect(); print(c.execute(text("SELECT count(*) FROM pg_class WHERE relname IN (:sessions,:events)"), {"sessions":"tutor_sessions","events":"tutor_events"}).scalar_one()); c.close(); e.dispose()')"
          echo "Published candidate questions: $published_count"
          echo "Tutor tables present: $tutor_tables"
          test "$published_count" -ge "$EXPECTED_LAUNCH_PACKAGES"
          test "$tutor_tables" -eq 2

      - name: Deploy current API and worker to ECS
        id: ecs
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-ecs.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f environment=production

          run_id=""
          for attempt in $(seq 1 30); do
            run_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow deploy-ecs.yml \
              --branch "$GITHUB_REF_NAME" \
              --event workflow_dispatch \
              --limit 10 \
              --json databaseId,headSha,createdAt \
              --jq 'map(select(.headSha == env.GITHUB_SHA)) | sort_by(.createdAt) | last | .databaseId // empty')"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 2
          done
          if [ -z "$run_id" ]; then
            echo "Could not locate dispatched ECS run for $GITHUB_SHA."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Waiting for ECS deployment workflow $run_id."
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Deploy prebuilt web artifact to production
        id: vercel
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Vercel production deployment: $deployment_url"

      - name: Verify end-to-end production stack
        shell: bash
        run: |
          set -euo pipefail

          # Give the production alias a short window to converge to the promoted deployment.
          live=0
          for attempt in $(seq 1 20); do
            status="$(curl --silent --output /tmp/livez.json --write-out '%{http_code}' "$PRODUCTION_URL/api/backend/livez" || true)"
            if [ "$status" = "200" ] && grep -q '"status":"ok"' /tmp/livez.json; then
              live=1
              break
            fi
            sleep 3
          done
          if [ "$live" -ne 1 ]; then
            echo "Production BFF/backend never became live."
            cat /tmp/livez.json || true
            exit 1
          fi

          curl --fail --silent --show-error --location "$PRODUCTION_URL/" >/tmp/skillforge.html
          grep -Eq "SkillForge|SkillsForge" /tmp/skillforge.html

          ready_status="$(curl --silent --output /tmp/readyz.json --write-out '%{http_code}' "$PRODUCTION_URL/api/backend/readyz")"
          if [ "$ready_status" != "200" ]; then
            echo "Production readiness failed with HTTP $ready_status"
            cat /tmp/readyz.json
            exit 1
          fi

          auth_status="$(curl --silent --output /tmp/auth.json --write-out '%{http_code}' "$PRODUCTION_URL/api/backend/api/v1/auth/me")"
          if [ "$auth_status" != "401" ] && [ "$auth_status" != "200" ]; then
            echo "Unexpected anonymous auth status: $auth_status"
            cat /tmp/auth.json
            exit 1
          fi

          tutor_status="$(curl --silent --output /tmp/tutor.json --write-out '%{http_code}' "$PRODUCTION_URL/api/backend/api/v1/tutor/capabilities")"
          if [ "$tutor_status" != "401" ] && [ "$tutor_status" != "200" ]; then
            echo "Tutor API is not reachable through the production BFF: HTTP $tutor_status"
            cat /tmp/tutor.json
            exit 1
          fi

          headers="$(curl --silent --show-error --head "$PRODUCTION_URL/")"
          if printf '%s\n' "$headers" | grep -Ei '^content-security-policy:' | grep -Eq 'localhost|127\.0\.0\.1'; then
            echo "Production CSP still exposes a localhost dependency."
            exit 1
          fi
          if grep -Eq 'localhost:8002|127\.0\.0\.1:8002' /tmp/skillforge.html; then
            echo "Production HTML still contains a local API dependency."
            exit 1
          fi

          echo "SkillForge production passed web, BFF, API readiness, auth, tutor, and CSP checks."
