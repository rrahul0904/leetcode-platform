name: Deploy SkillForge to Vercel

on:
  push:
    branches:
      - agent/vercel-clean-skillforge
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skillforge-vercel-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_zmEezpOKGZy2sH5nqTfO44LD
  VERCEL_PROJECT_ID: prj_fnbuYcKQeKrEq5Sax2uWdTg2SHqT

jobs:
  deploy:
    name: Build and deploy existing SkillForge project
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout deployment commit
        uses: actions/checkout@v4

      - name: Require Vercel deployment credential
        shell: bash
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN GitHub Actions secret is not configured."
            echo "The existing SkillForge Vercel project was not modified."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.7.0

      - name: Link existing SkillForge project and pull production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Validate Vercel production environment
        shell: bash
        run: |
          set -a
          source .vercel/.env.production.local
          set +a

          missing=0
          for name in NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY CLERK_SECRET_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required Vercel production variable: $name"
              missing=1
            fi
          done
          if [ -z "${RIGOR_DATABASE_URL:-}" ] && [ -z "${POSTGRES_URL:-}" ]; then
            echo "Missing managed PostgreSQL connection: RIGOR_DATABASE_URL or POSTGRES_URL"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install locked Python workspace
        run: uv sync --frozen --all-packages

      - name: Build production artifact before database changes
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Migrate and seed managed SkillForge PostgreSQL
        shell: bash
        run: |
          set -a
          source .vercel/.env.production.local
          set +a

          if [ -z "${RIGOR_DATABASE_URL:-}" ]; then
            export RIGOR_DATABASE_URL="${POSTGRES_URL:-}"
          fi

          case "$RIGOR_DATABASE_URL" in
            postgres://*)
              export RIGOR_DATABASE_URL="postgresql+psycopg://${RIGOR_DATABASE_URL#postgres://}"
              ;;
            postgresql://*)
              export RIGOR_DATABASE_URL="postgresql+psycopg://${RIGOR_DATABASE_URL#postgresql://}"
              ;;
          esac

          uv run alembic upgrade head

          seed_url="${POSTGRES_URL:-${RIGOR_DATABASE_URL/postgresql+psycopg:/postgresql:}}"
          RIGOR_SEED_DATABASE_URL="$seed_url" uv run python scripts/seed_database.py

      - name: Deploy production artifact
        id: deploy
        shell: bash
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Deployed $deployment_url"

      - name: Verify deployed landing page
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          curl --fail --silent --show-error --location "$DEPLOYMENT_URL/" >/tmp/skillforge.html
          grep -q "SkillForge" /tmp/skillforge.html

      - name: Verify Vercel BFF route exists
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          status="$(curl --silent --output /tmp/bff.json --write-out '%{http_code}' "$DEPLOYMENT_URL/api/backend/api/v1/auth/me")"
          if [ "$status" = "404" ]; then
            echo "The deployed site does not contain the SkillForge BFF route."
            exit 1
          fi
          if [ "$status" != "401" ] && [ "$status" != "200" ]; then
            echo "Unexpected anonymous BFF status: $status"
            cat /tmp/bff.json
            exit 1
          fi

      - name: Reject localhost API dependencies in production CSP
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          headers="$(curl --silent --show-error --head "$DEPLOYMENT_URL/")"
          if printf '%s\n' "$headers" | grep -Ei '^content-security-policy:' | grep -Eq 'localhost:8002|127\.0\.0\.1:8002'; then
            echo "Production deployment still exposes a localhost API dependency in CSP."
            exit 1
          fi
