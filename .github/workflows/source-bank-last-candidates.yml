name: Source bank last provenance candidates

on:
  push:
    branches:
      - agent/source-backed-question-bank

permissions:
  contents: read

jobs:
  competitive-programming:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        repository:
          - luctivud/All-Of-Competitive-Programming
          - praveendareddy21/Competitive-Programming
          - shiningflash/Competitive-Programming-Resources
          - satyajitghana/Competitive-Programming
          - jonh14lk/Competitive_Programming
          - thecodingwizard/competitive-programming
    steps:
      - name: Scan historical fingerprints
        shell: bash
        env:
          CANDIDATE: ${{ matrix.repository }}
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none "https://github.com/${CANDIDATE}.git" /tmp/repo
          python - <<'PY'
          import os, pathlib, subprocess
          full=os.environ['CANDIDATE']; repo='/tmp/repo'
          useful_ext={'.cpp','.cc','.cxx','.c++','.c','.h','.hpp','.txt','.md','.py','.java'}
          binary_ext={'.pdf','.zip','.rar','.7z','.exe','.out','.bin','.jpg','.jpeg','.png','.gif','.class'}
          rows=subprocess.check_output(['git','-C',repo,'log','--all','--before=2026-08-02T00:00:00Z','--format=%H %T'], text=True).splitlines()
          seen=set(); hits=[]
          for line in rows:
              commit,tree=line.split()
              if tree in seen: continue
              seen.add(tree)
              listing=subprocess.check_output(['git','-C',repo,'ls-tree','-r','-l',tree], text=True, errors='replace').splitlines()
              paths=[]; total_size=0
              for raw in listing:
                  parts=raw.split(None,4)
                  if len(parts)<5 or parts[1] != 'blob': continue
                  size,path=parts[3],parts[4]
                  paths.append(path)
                  if size.isdigit(): total_size += int(size)
              cpp=sum(pathlib.PurePosixPath(p).suffix.lower() in {'.cpp','.cc','.cxx','.c++'} for p in paths)
              useful=sum(pathlib.PurePosixPath(p).suffix.lower() in useful_ext for p in paths)
              binaries=sum(pathlib.PurePosixPath(p).suffix.lower() in binary_ext for p in paths)
              if useful==224 or cpp==149:
                  hits.append((commit,tree,len(paths),useful,cpp,binaries,total_size))
          print(f'CP_SCAN repo={full} unique_trees={len(seen)} hits={len(hits)}')
          for h in hits: print('CP_CONTENT_HIT repo=%s sha=%s tree=%s files=%s useful=%s cpp=%s binaries=%s bytes=%s'%((full,)+h))
          PY

  awesome-resource:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify locked GPL pattern source
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/ashishps1/awesome-leetcode-resources.git /tmp/awesome
          git -C /tmp/awesome checkout --quiet 095f5a34af0414f147fe6efdcf1e070664eff362
          python - <<'PY'
          from pathlib import Path
          root=Path('/tmp/awesome')
          code_ext={'.py','.cpp','.cc','.cxx','.java','.js','.ts','.go','.c','.kt','.cs','.rb','.swift'}
          pattern_files=[p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and 'pattern' in '/'.join(p.parts).lower() and p.suffix.lower() in code_ext]
          all_code=[p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p.suffix.lower() in code_ext]
          license_text=''.join(p.read_text(errors='ignore') for p in root.glob('LICENSE*'))
          print(f'AWESOME_FINGERPRINT pattern_code_files={len(pattern_files)} all_code_files={len(all_code)} gpl3={"GNU GENERAL PUBLIC LICENSE" in license_text and "Version 3" in license_text}')
          PY
