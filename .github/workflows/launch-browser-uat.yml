name: Launch browser UAT

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "scripts/verify-launch-browser.mjs"
      - ".github/workflows/launch-browser-uat.yml"
  push:
    branches:
      - main
      - "agent/launch-assurance-*"
    paths:
      - "apps/web/**"
      - "scripts/verify-launch-browser.mjs"
      - ".github/workflows/launch-browser-uat.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Authenticated candidate navigation smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: pnpm

      - name: Install locked JavaScript workspace
        run: pnpm install --frozen-lockfile

      - name: Run web app
        env:
          NEXT_PUBLIC_RIGOR_AUTH_MODE: local
          NEXT_PUBLIC_RIGOR_API_URL: /api/backend
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @rigor/web dev >/tmp/launch-web.log 2>&1 &
          echo "$!" > /tmp/launch-web.pid

      - name: Verify candidate launch routes in Chrome
        env:
          LAUNCH_BROWSER_BASE_URL: http://localhost:3001
        run: node scripts/verify-launch-browser.mjs

      - name: Show development server log on failure
        if: failure()
        run: cat /tmp/launch-web.log || true

      - name: Stop web app
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/launch-web.pid ]; then
            kill "$(cat /tmp/launch-web.pid)" 2>/dev/null || true
          fi
