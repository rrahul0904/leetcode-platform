name: Source bank targeted catalog fingerprint

on:
  push:
    branches:
      - agent/source-backed-question-bank

permissions:
  contents: read

jobs:
  kamyu:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Scan early Kamyu history
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none https://github.com/kamyu104/LeetCode-Solutions.git /tmp/repo
          python - <<'PY'
          import pathlib, subprocess, tempfile, zipfile, os
          repo='/tmp/repo'
          code_ext={'.py','.cpp','.cc','.cxx','.c++','.java','.js','.jsx','.ts','.go','.c','.kt','.cs','.dart','.rb','.swift'}
          useful_ext=code_ext|{'.md','.txt'}
          rows=subprocess.check_output(['git','-C',repo,'log','--all','--after=2013-01-01T00:00:00Z','--before=2017-01-01T00:00:00Z','--format=%H %T'], text=True).splitlines()
          seen=set(); hits=[]
          for line in rows:
              commit,tree=line.split()
              if tree in seen: continue
              seen.add(tree)
              paths=subprocess.check_output(['git','-C',repo,'ls-tree','-r','--name-only',tree], text=True).splitlines()
              code=sum(pathlib.PurePosixPath(p).suffix.lower() in code_ext for p in paths)
              useful=sum(pathlib.PurePosixPath(p).suffix.lower() in useful_ext for p in paths)
              if useful==222 or code==210 or (208 <= code <= 212 and 218 <= useful <= 226):
                  hits.append((commit,tree,len(paths),useful,code))
          print(f'KAMYU_EARLY unique_trees={len(seen)} hits={len(hits)}')
          for commit,tree,files,useful,code in hits:
              with tempfile.NamedTemporaryFile(suffix='.zip') as tmp:
                  subprocess.run(['git','-C',repo,'archive','--format=zip',f'--output={tmp.name}',commit],check=True)
                  with zipfile.ZipFile(tmp.name) as zf: entries=len(zf.infolist())
                  size=os.path.getsize(tmp.name)
              print(f'KAMYU_HIT sha={commit} tree={tree} files={files} useful={useful} code={code} entries={entries} bytes={size}')
          PY
