name: CareerOS Wave 3 lock refresh

on:
  push:
    branches:
      - agent/careeros-wave-3-resume-ingestion
    paths:
      - apps/api/pyproject.toml
      - .github/workflows/careeros-wave3-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/careeros-wave-3-resume-ingestion
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Refresh lockfile
        run: uv lock
      - name: Commit lockfile if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already matches pyproject metadata."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "build(careeros): refresh uv lock for pypdf"
          git push origin HEAD:agent/careeros-wave-3-resume-ingestion
