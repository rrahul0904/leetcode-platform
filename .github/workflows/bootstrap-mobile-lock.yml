name: Bootstrap mobile workspace lock

on:
  push:
    branches:
      - agent/1m-corpus-ingestion

permissions:
  contents: write

jobs:
  bootstrap-mobile-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/1m-corpus-ingestion
          fetch-depth: 0
      - name: Set up pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: pnpm
      - name: Regenerate lockfile for imported mobile workspace
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Install locked workspace
        run: pnpm install --frozen-lockfile
      - name: Typecheck imported mobile app
        run: pnpm --filter @rigor/mobile typecheck
      - name: Remove one-time bootstrap workflow
        run: rm .github/workflows/bootstrap-mobile-lock.yml
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/bootstrap-mobile-lock.yml
          git commit -m "Integrate mobile workspace lockfile"
          git push origin HEAD:agent/1m-corpus-ingestion
