name: Bootstrap Clerk workspace lock

on:
  push:
    branches:
      - agent/1m-corpus-ingestion
    paths:
      - apps/web/package.json
      - .github/workflows/bootstrap-clerk-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/1m-corpus-ingestion
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Regenerate workspace lock
        run: pnpm install --lockfile-only
      - name: Verify frozen install
        run: pnpm install --frozen-lockfile
      - name: Verify SkillForge web typecheck
        run: pnpm --filter @rigor/web typecheck
      - name: Commit lockfile and remove bootstrap workflow
        shell: bash
        run: |
          rm .github/workflows/bootstrap-clerk-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/bootstrap-clerk-lock.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Lock Clerk web authentication dependencies"
          git push
