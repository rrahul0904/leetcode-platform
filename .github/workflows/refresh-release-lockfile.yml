name: Refresh release lockfile

on:
  pull_request:
    branches:
      - main
    paths:
      - pnpm-workspace.yaml
      - .github/workflows/refresh-release-lockfile.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Set up pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: pnpm
      - name: Regenerate lockfile from reviewed overrides
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit generated lockfile if changed
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix(security): refresh lockfile for patched dependencies"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
