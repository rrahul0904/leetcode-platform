name: One-time Phase 6 workspace wiring

on:
  push:
    branches:
      - agent/question-bank-phases-0-6

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/question-bank-phases-0-6
          fetch-depth: 0

      - name: Replace workspace route implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/web/app/problems/[slug]/page.tsx")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'import { KnowledgeProblemWorkspace } from "@/components/knowledge-problem-workspace";',
              'import { PersistentKnowledgeProblemWorkspace } from "@/components/persistent-knowledge-problem-workspace";',
          )
          text = text.replace(
              "return <KnowledgeProblemWorkspace slug={slug} />;",
              "return <PersistentKnowledgeProblemWorkspace slug={slug} />;",
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-phase6-route.yml

      - name: Commit persistent workspace route
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Connect workspace to persistent candidate evidence"
          git push origin HEAD:agent/question-bank-phases-0-6
