name: Source bank exact fingerprint

on:
  pull_request:

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Exact company CSV revisions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rigor-fp
          scan_company() {
            local label="$1" url="$2" want_csv="$3" want_rows="$4"
            local repo="/tmp/rigor-fp/$label"
            git clone --quiet "$url" "$repo"
            python - "$label" "$repo" "$want_csv" "$want_rows" <<'PY'
          import csv, io, subprocess, sys, tarfile
          label, repo, want_csv, want_rows = sys.argv[1], sys.argv[2], int(sys.argv[3]), int(sys.argv[4])
          rows = subprocess.check_output(['git','-C',repo,'log','--all','--before=2026-08-02T00:00:00Z','--format=%H %T'], text=True).splitlines()
          seen=set(); exact=[]; closest=[]
          for line in rows:
              commit, tree = line.split()
              if tree in seen: continue
              seen.add(tree)
              archive = subprocess.check_output(['git','-C',repo,'archive','--format=tar',tree])
              csv_count=0; row_count=0
              with tarfile.open(fileobj=io.BytesIO(archive), mode='r:') as tf:
                  for member in tf.getmembers():
                      if not member.isfile() or not member.name.lower().endswith('.csv'): continue
                      csv_count += 1
                      fh=tf.extractfile(member)
                      if fh is None: continue
                      text=fh.read().decode('utf-8-sig', errors='replace')
                      try:
                          parsed=list(csv.reader(io.StringIO(text)))
                          row_count += max(0, len(parsed)-1)
                      except csv.Error:
                          row_count += max(0, len(text.splitlines())-1)
              delta=abs(csv_count-want_csv)*1000000+abs(row_count-want_rows)
              closest.append((delta,csv_count,row_count,commit,tree))
              if csv_count==want_csv and row_count==want_rows:
                  exact.append((commit,tree))
          closest.sort()
          print(f'COMPANY_SCAN {label} unique_trees={len(seen)} target_csv={want_csv} target_rows={want_rows}')
          for commit,tree in exact:
              print(f'COMPANY_EXACT {label} sha={commit} tree={tree}')
          if not exact:
              for delta,csv_count,row_count,commit,tree in closest[:8]:
                  print(f'COMPANY_CLOSE {label} csv={csv_count} rows={row_count} sha={commit} tree={tree}')
          PY
          }
          scan_company company_index https://github.com/liquidslr/interview-company-wise-problems.git 2350 32922
          scan_company company_interview https://github.com/snehasishroy/leetcode-companywise-interview-questions.git 1648 39353
          scan_company company_large https://github.com/krishnadey30/LeetCode-Questions-CompanyWise.git 537 20453

      - name: Exact solution-source tree fingerprints
        shell: bash
        run: |
          set -euo pipefail
          scan_tree() {
            local label="$1" url="$2" want_files="$3" want_code="$4" mode="$5"
            local repo="/tmp/rigor-fp/$label"
            rm -rf "$repo"
            git clone --quiet --filter=blob:none "$url" "$repo" || { echo "TREE_CLONE_FAIL $label $url"; return; }
            python - "$label" "$repo" "$want_files" "$want_code" "$mode" "$url" <<'PY'
          import pathlib, subprocess, sys
          label, repo, want_files, want_code, mode, url = sys.argv[1], sys.argv[2], int(sys.argv[3]), int(sys.argv[4]), sys.argv[5], sys.argv[6]
          rows=subprocess.check_output(['git','-C',repo,'log','--all','--before=2026-08-02T00:00:00Z','--format=%H %T'], text=True).splitlines()
          seen=set(); exact=[]; close=[]
          code_ext={'.py','.cpp','.cc','.cxx','.c++','.java','.js','.go','.c','.kt','.cs','.dart'}
          for line in rows:
              commit,tree=line.split()
              if tree in seen: continue
              seen.add(tree)
              paths=subprocess.check_output(['git','-C',repo,'ls-tree','-r','--name-only',tree], text=True, errors='replace').splitlines()
              files=len(paths)
              if mode=='cpp':
                  code=sum(pathlib.PurePosixPath(p).suffix.lower() in {'.cpp','.cc','.cxx','.c++'} for p in paths)
              else:
                  code=sum(pathlib.PurePosixPath(p).suffix.lower() in code_ext for p in paths)
              delta=abs(files-want_files)*1000+abs(code-want_code)
              close.append((delta,files,code,commit,tree))
              if files==want_files and code==want_code:
                  exact.append((commit,tree))
          close.sort()
          print(f'TREE_SCAN {label} target_files={want_files} target_code={want_code} mode={mode} url={url} unique_trees={len(seen)}')
          for commit,tree in exact[:20]: print(f'TREE_EXACT {label} sha={commit} tree={tree} url={url}')
          if not exact:
              for delta,files,code,commit,tree in close[:5]: print(f'TREE_CLOSE {label} files={files} code={code} sha={commit} tree={tree} url={url}')
          PY
          }

          # LeetCode-Solutions-master.zip: actual upload fingerprint = 222 files / 210 code files.
          scan_tree js_kamyu https://github.com/kamyu104/LeetCode-Solutions.git 222 210 any
          scan_tree js_apsolut https://github.com/apsolut-javascript/LeetCode-Solutions.git 222 210 any
          scan_tree js_dmitry https://github.com/DmitryNaimark/leetcode-solutions.git 222 210 any
