name: Source bank exact fingerprint

on:
  pull_request:

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Discriminate MIT LeetCode solution archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rigor-fp
          scan_js() {
            local label="$1" url="$2"
            local repo="/tmp/rigor-fp/$label"
            rm -rf "$repo"
            git clone --quiet --filter=blob:none "$url" "$repo" || { echo "JS_CLONE_FAIL $label $url"; return; }
            python - "$label" "$repo" "$url" <<'PY'
          import pathlib, re, subprocess, sys
          label, repo, url = sys.argv[1:]
          cutoff='2026-08-02T00:00:00Z'
          rows=subprocess.check_output(['git','-C',repo,'log','--all',f'--before={cutoff}','--format=%H %T'], text=True).splitlines()
          seen=set(); matches=[]
          code_ext={'.py','.cpp','.cc','.cxx','.c++','.java','.js','.jsx','.ts','.go','.c','.kt','.cs','.dart','.rb','.swift'}
          for line in rows:
              commit,tree=line.split()
              if tree in seen: continue
              seen.add(tree)
              paths=subprocess.check_output(['git','-C',repo,'ls-tree','-r','--name-only',tree], text=True, errors='replace').splitlines()
              dirs=set()
              for raw in paths:
                  parent=pathlib.PurePosixPath(raw).parent
                  while str(parent) not in ('','.'): dirs.add(str(parent)); parent=parent.parent
              entries=1+len(paths)+len(dirs)
              if entries != 288: continue
              code=sum(pathlib.PurePosixPath(p).suffix.lower() in code_ext for p in paths)
              js=sum(pathlib.PurePosixPath(p).suffix.lower() in {'.js','.jsx'} for p in paths)
              license_paths=[p for p in paths if pathlib.PurePosixPath(p).name.casefold() in {'license','license.md','license.txt'}]
              readmes=[p for p in paths if pathlib.PurePosixPath(p).name.casefold() in {'readme','readme.md','readme.txt'}]
              license_text=''
              if license_paths:
                  license_text=subprocess.run(['git','-C',repo,'show',f'{commit}:{license_paths[0]}'], text=True, errors='replace', capture_output=True).stdout
              readme=''
              if readmes:
                  readme=subprocess.run(['git','-C',repo,'show',f'{commit}:{readmes[0]}'], text=True, errors='replace', capture_output=True).stdout
              lowered=readme.casefold()
              sig={
                  'mit': 'mit license' in license_text.casefold() or 'permission is hereby granted' in license_text.casefold(),
                  'time': bool(re.search(r'\btime\b', lowered)),
                  'space': bool(re.search(r'\bspace\b', lowered)),
                  'difficulty': 'difficulty' in lowered or 'level' in lowered,
                  'topic': 'topic' in lowered or 'tag' in lowered,
                  'solution': 'solution' in lowered,
              }
              score=sum(sig.values())
              matches.append((score,code,js,commit,tree,sig,readmes[0] if readmes else '',license_paths[0] if license_paths else ''))
          print(f'JS_SCAN {label} url={url} unique_trees={len(seen)} exact_entry_trees={len(matches)}')
          for row in sorted(matches, reverse=True)[:30]:
              score,code,js,commit,tree,sig,readme_path,license_path=row
              print(f'JS_MATCH {label} score={score} code={code} js={js} sha={commit} tree={tree} readme={readme_path} license={license_path} sig={sig} url={url}')
          PY
          }

          scan_js kamyu https://github.com/kamyu104/LeetCode-Solutions.git
          scan_js apsolut https://github.com/apsolut-javascript/LeetCode-Solutions.git
          scan_js codedecks https://github.com/codedecks-in/LeetCode-Solutions.git
          scan_js shy https://github.com/SHY-Corp/LeetCode-Solutions.git
          scan_js realhacker https://github.com/RealHacker/leetcode-solutions.git
          scan_js franklingu https://github.com/franklingu/leetcode-solutions.git
          scan_js qinhanmin https://github.com/qinhanmin2014/LeetCode-solutions.git
          scan_js knightjoker https://github.com/KnightJoker/LeetCode-Solutions.git
          scan_js sankalp https://github.com/sankalpdayal5/LeetCode-Solutions.git
          scan_js wonz https://github.com/Wonz5130/LeetCode-Solutions.git
          scan_js trung https://github.com/trung-hn/leetcode-solutions.git
          scan_js alexey https://github.com/alexeygrigorev/leetcode-solutions.git
          scan_js ahmetb https://github.com/ahmetb/leetcode-solutions.git
          scan_js akcps https://github.com/Akcps/leetcode-solutions.git
          scan_js amanchadha https://github.com/amanchadha/LeetCode-Solutions.git

      - name: Discriminate C++ MIT archive
        shell: bash
        run: |
          set -euo pipefail
          repo=/tmp/rigor-fp/codedecks-cpp
          rm -rf "$repo"
          git clone --quiet https://github.com/codedecks-in/LeetCode-Solutions.git "$repo"
          python - "$repo" <<'PY'
          import pathlib, subprocess, sys
          repo=sys.argv[1]
          rows=subprocess.check_output(['git','-C',repo,'log','--all','--before=2026-08-02T00:00:00Z','--format=%H %T'], text=True).splitlines()
          seen=set()
          for line in rows:
              commit,tree=line.split()
              if tree in seen: continue
              seen.add(tree)
              paths=subprocess.check_output(['git','-C',repo,'ls-tree','-r','--name-only',tree], text=True, errors='replace').splitlines()
              dirs=set()
              for raw in paths:
                  parent=pathlib.PurePosixPath(raw).parent
                  while str(parent) not in ('','.'): dirs.add(str(parent)); parent=parent.parent
              entries=1+len(paths)+len(dirs)
              cpp=sum(pathlib.PurePosixPath(p).suffix.lower() in {'.cpp','.cc','.cxx','.c++'} for p in paths)
              if entries==334 or cpp==108:
                  print(f'CPP_MIT_MATCH entries={entries} files={len(paths)} cpp={cpp} sha={commit} tree={tree}')
          PY

      - name: Discriminate Competitive Programming archives
        shell: bash
        run: |
          set -euo pipefail
          scan_cp() {
            local label="$1" url="$2"
            local repo="/tmp/rigor-fp/$label"
            rm -rf "$repo"
            git clone --quiet --filter=blob:none "$url" "$repo"
            python - "$label" "$repo" "$url" <<'PY'
          import pathlib, subprocess, sys
          label,repo,url=sys.argv[1:]
          rows=subprocess.check_output(['git','-C',repo,'log','--all','--before=2026-08-02T00:00:00Z','--format=%H %T'], text=True).splitlines()
          seen=set(); results=[]
          binary_ext={'.pdf','.zip','.rar','.7z','.exe','.out','.bin','.jpg','.jpeg','.png','.gif','.class'}
          for line in rows:
              commit,tree=line.split()
              if tree in seen: continue
              seen.add(tree)
              listing=subprocess.check_output(['git','-C',repo,'ls-tree','-r','-l',tree], text=True, errors='replace').splitlines()
              paths=[]; total_size=0
              for raw in listing:
                  parts=raw.split(None,4)
                  if len(parts)<5: continue
                  _,typ,_,size,path=parts
                  if typ!='blob': continue
                  paths.append(path)
                  if size.isdigit(): total_size += int(size)
              dirs=set()
              for raw in paths:
                  parent=pathlib.PurePosixPath(raw).parent
                  while str(parent) not in ('','.'): dirs.add(str(parent)); parent=parent.parent
              entries=1+len(paths)+len(dirs)
              if entries != 470: continue
              cpp=sum(pathlib.PurePosixPath(p).suffix.lower() in {'.cpp','.cc','.cxx','.c++'} for p in paths)
              binaries=sum(pathlib.PurePosixPath(p).suffix.lower() in binary_ext for p in paths)
              useful=sum(pathlib.PurePosixPath(p).suffix.lower() in {'.cpp','.cc','.cxx','.c++','.c','.h','.hpp','.txt','.md','.py','.java'} for p in paths)
              top=sorted({pathlib.PurePosixPath(p).parts[0] for p in paths if pathlib.PurePosixPath(p).parts})[:25]
              results.append((abs(cpp-149),cpp,useful,binaries,total_size,commit,tree,top))
          print(f'CP_SCAN {label} url={url} unique_trees={len(seen)} exact_entry_trees={len(results)}')
          for delta,cpp,useful,binaries,total_size,commit,tree,top in sorted(results)[:40]:
              print(f'CP_MATCH {label} cpp={cpp} useful={useful} binaries={binaries} bytes={total_size} sha={commit} tree={tree} top={top} url={url}')
          PY
          }
          scan_cp ashutosh https://github.com/ashutoshm1771/Competitive-Programming.git
          scan_cp om https://github.com/om-ashish-soni/Competitive-Programming.git
