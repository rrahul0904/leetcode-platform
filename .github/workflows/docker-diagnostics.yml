name: Docker build diagnostics

on:
  push:
    branches:
      - agent/docker-diag-f68ac

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Capture execution image builds
        id: builds
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          status=0
          {
            echo '=== docker info ==='
            docker version
            echo '=== python runner ==='
            docker build --progress=plain --secret id=build_ca,src=/etc/ssl/certs/ca-certificates.crt -t rigor-python-runner:diag -f services/python-runner/Dockerfile . || status=$?
            echo "python_status=$status"
            if [ "$status" -eq 0 ]; then
              echo '=== sql runner ==='
              docker build --progress=plain --secret id=build_ca,src=/etc/ssl/certs/ca-certificates.crt -t rigor-sql-runner:diag -f services/sql-runner/Dockerfile . || status=$?
              echo "sql_status=$status"
            fi
            if [ "$status" -eq 0 ]; then
              echo '=== execution controller ==='
              docker build --progress=plain --secret id=build_ca,src=/etc/ssl/certs/ca-certificates.crt -t rigor-execution-controller:diag -f services/execution-controller/Dockerfile . || status=$?
              echo "controller_status=$status"
            fi
          } 2>&1 | tee docker-build-diagnostics.txt
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-build-diagnostics
          path: docker-build-diagnostics.txt
          retention-days: 2
      - name: Preserve failure
        if: steps.builds.outcome == 'failure'
        run: exit 1
