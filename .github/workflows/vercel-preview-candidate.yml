name: Vercel Preview candidate

on:
  push:
    branches:
      - codex/release-integration

permissions:
  contents: read

concurrency:
  group: vercel-preview-candidate
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_zmEezpOKGZy2sH5nqTfO44LD
  VERCEL_PROJECT_ID: prj_fnbuYcKQeKrEq5Sax2uWdTg2SHqT
  VERCEL_PROJECT_NAME: skillforge-interactive-demo

jobs:
  preview:
    name: Inspect existing project and deploy Preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.7.0

      - name: Verify linked project and inspect Preview settings
        id: inspect
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "The repository VERCEL_TOKEN secret is unavailable to this branch push."
            exit 1
          fi

          project_json="$(curl --fail --silent --show-error \
            --header @- \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            <<<"Authorization: Bearer $VERCEL_TOKEN")"
          python -c 'import json,sys; project=json.load(sys.stdin); expected_id,expected_name=sys.argv[1:3]; link=project.get("link") or {}; assert project.get("id")==expected_id and project.get("name")==expected_name, "Vercel project identity does not match the checked-in release target."; assert link.get("type")=="github" and link.get("repo")=="leetcode-platform", "Vercel project is not linked to the expected GitHub repository."; assert link.get("org", "").lower()=="rrahul0904", "Vercel project is linked to a different GitHub owner."; print("Verified Vercel project: {} ({})".format(project.get("name"), project.get("id"))); print("GitHub link: {}/{}".format(link.get("org"), link.get("repo"))); print("Configured production branch: {}".format(link.get("productionBranch", "not reported")))' "$VERCEL_PROJECT_ID" "$VERCEL_PROJECT_NAME" <<<"$project_json"

          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' \
            "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

          env_json="$(curl --fail --silent --show-error \
            --header @- \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID" \
            <<<"Authorization: Bearer $VERCEL_TOKEN")"
          python -c 'import json,sys; items=json.load(sys.stdin).get("envs", []); names=sorted({item.get("key", "") for item in items if "preview" in (item.get("target") or []) and item.get("key")}); print("### Existing Vercel Preview environment variable names"); print("\n".join("- " + name for name in names) if names else "No Preview variables are configured.")' <<<"$env_json" >> "$GITHUB_STEP_SUMMARY"

          deployments_json="$(curl --fail --silent --show-error \
            --header @- \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&target=preview&limit=20" \
            <<<"Authorization: Bearer $VERCEL_TOKEN")"
          existing_deployment="$(python -c 'import json,sys; sha=sys.argv[1]; deployments=json.load(sys.stdin).get("deployments", []); match=next((d for d in deployments if (d.get("meta") or {}).get("githubCommitSha")==sha and d.get("readyState")=="READY"), None); print(json.dumps({"id": match.get("uid") or match.get("id", ""), "url": match.get("url", "")}) if match else "")' "$GITHUB_SHA" <<<"$deployments_json")"
          if [ -n "$existing_deployment" ]; then
            existing_url="$(python -c 'import json,sys; print(json.load(sys.stdin)["url"])' <<<"$existing_deployment")"
            existing_id="$(python -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<<"$existing_deployment")"
            {
              echo "preview_url=https://$existing_url"
              echo "deployment_id=$existing_id"
              echo "existing=true"
            } >> "$GITHUB_OUTPUT"
          else
            echo "existing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and deploy as Preview
        if: steps.inspect.outputs.existing != 'true'
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          url="$(vercel deploy --yes \
            --meta githubCommitSha="$GITHUB_SHA" \
            --meta githubCommitRef="$GITHUB_REF_NAME")"
          echo "preview_url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify exact Preview deployment
        id: verify
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.inspect.outputs.preview_url || steps.deploy.outputs.preview_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          host="${PREVIEW_URL#https://}"
          host="${host#http://}"
          host="${host%/}"
          for attempt in $(seq 1 40); do
            deployment_json="$(curl --fail --silent --show-error \
              --header @- \
              "https://api.vercel.com/v13/deployments/$host?teamId=$VERCEL_ORG_ID" \
              <<<"Authorization: Bearer $VERCEL_TOKEN")"
            state="$(python -c 'import json,sys; print(json.load(sys.stdin).get("readyState", ""))' <<<"$deployment_json")"
            case "$state" in
              READY) break ;;
              ERROR|FAILED|CANCELED)
                echo "Vercel Preview deployment failed in state $state."
                exit 1
                ;;
            esac
            if [ "$attempt" -eq 40 ]; then
              echo "Vercel Preview did not become READY within ten minutes (state: $state)."
              exit 1
            fi
            sleep 15
          done

          python -c 'import json,sys; d=json.load(sys.stdin); sha,project_id,output_path=sys.argv[1:4]; assert d.get("readyState")=="READY", "Vercel Preview deployment is not READY."; assert d.get("target")=="preview", "Vercel deployment target is not Preview."; assert d.get("projectId")==project_id, "Vercel deployment belongs to a different project."; assert (d.get("meta") or {}).get("githubCommitSha")==sha, "Vercel deployment metadata does not match the candidate SHA."; print("Verified ready Preview deployment {} for commit {}.".format(d.get("id"), sha)); open(output_path, "a", encoding="utf-8").write("deployment_id={}\npreview_url=https://{}\n".format(d.get("id", ""), d.get("url", "")))' "$GITHUB_SHA" "$VERCEL_PROJECT_ID" "$GITHUB_OUTPUT" <<<"$deployment_json"

          {
            echo "### Vercel Preview candidate"
            echo "- Candidate SHA: \`$GITHUB_SHA\`"
            echo "- Vercel deployment ID: \`$(python -c 'import json,sys; print(json.load(sys.stdin).get("id", ""))' <<<"$deployment_json")\`"
            echo "- Verified target: Preview"
            echo "- Verified state: READY"
            echo "- URL: https://$(python -c 'import json,sys; print(json.load(sys.stdin).get("url", ""))' <<<"$deployment_json")"
            echo "- Deployment commit metadata matches the candidate SHA."
          } >> "$GITHUB_STEP_SUMMARY"
