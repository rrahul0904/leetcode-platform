name: Source JS targeted recovery

on:
  push:
    branches:
      - agent/source-backed-question-bank

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        repository:
          - zhangyuf00/LeetCode-Solutions
          - manthanank/leetcode-solutions
          - ifmos/leetcode-solutions
          - timothyshores/LeetCode-JavaScript-Solutions
          - catt-wuyang/leetcode-javascript-solutions
          - rishabh1403/leetcode-javascript-solutions
          - S-Vasanth/leetcode-javascript-solutions
          - AidenLee26/leetcode-javascript-solutions
          - mbratul/leetcode-javascript-solutions
          - alexwawl/leetcode-solutions-javascript-python
          - makanab/leetcode-solutions-javascript-python
          - lifeeric/leetcode-solutions-javascript-python
          - mdixon47/leetcode-solutions-javascript-python
          - alanStocco/leetcode-solutions-javascript-python
          - Mercurius13/leetcode-solutions-visualizer
    steps:
      - name: Scan historical trees
        shell: bash
        env:
          REPOSITORY: ${{ matrix.repository }}
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout "https://github.com/${REPOSITORY}.git" /tmp/repo
          python - <<'PY'
          import collections
          import os
          import pathlib
          import subprocess

          repo = "/tmp/repo"
          name = os.environ["REPOSITORY"]
          rows = subprocess.check_output(
              ["git", "-C", repo, "log", "--all", "--before=2026-08-02T00:00:00Z", "--format=%H %T"],
              text=True,
          ).splitlines()
          seen = set()
          hits = []
          code_ext = {".py", ".cpp", ".cc", ".cxx", ".c++", ".c", ".java", ".js", ".jsx", ".ts", ".tsx", ".go", ".kt", ".cs", ".dart", ".rb", ".swift"}
          for row in rows:
              commit, tree = row.split()
              if tree in seen:
                  continue
              seen.add(tree)
              paths = subprocess.check_output(
                  ["git", "-C", repo, "ls-tree", "-r", "--name-only", tree], text=True
              ).splitlines()
              dirs = set()
              ext = collections.Counter()
              for raw in paths:
                  path = pathlib.PurePosixPath(raw)
                  ext[path.suffix.lower() or "<none>"] += 1
                  parent = path.parent
                  while str(parent) not in ("", "."):
                      dirs.add(str(parent))
                      parent = parent.parent
              code = sum(ext[x] for x in code_ext)
              useful = code + ext[".md"] + ext[".txt"]
              js = ext[".js"] + ext[".jsx"] + ext[".ts"] + ext[".tsx"]
              raw_entries = 1 + len(paths) + len(dirs)
              if raw_entries == 288 or useful == 222 or code == 210:
                  summary = {
                      "repository": name,
                      "commit": commit,
                      "tree": tree,
                      "raw_entries": raw_entries,
                      "files": len(paths),
                      "dirs": len(dirs),
                      "useful": useful,
                      "code": code,
                      "javascript": js,
                      "extensions": dict(sorted(ext.items())),
                  }
                  hits.append(summary)
                  print("JS_CANDIDATE", summary)
                  if raw_entries == 288 and useful == 222 and code == 210:
                      print("JS_STRONG_MATCH", summary)
          print(f"JS_SUMMARY repository={name} unique_trees={len(seen)} candidates={len(hits)}")
          PY
