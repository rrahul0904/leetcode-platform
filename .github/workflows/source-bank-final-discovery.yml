name: Source bank final provenance discovery

on:
  push:
    branches:
      - agent/source-backed-question-bank

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scan omitted JavaScript candidate history
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none https://github.com/yiminghe/leetcode-solutions.git /tmp/repo
          python - <<'PY'
          import pathlib, subprocess
          repo='/tmp/repo'
          rows=subprocess.check_output(['git','-C',repo,'log','--all','--before=2026-08-02T00:00:00Z','--format=%H %T'], text=True).splitlines()
          seen=set(); hits=[]
          code_ext={'.py','.cpp','.cc','.cxx','.c++','.java','.js','.jsx','.ts','.go','.c','.kt','.cs','.dart','.rb','.swift'}
          for line in rows:
              commit,tree=line.split()
              if tree in seen: continue
              seen.add(tree)
              paths=subprocess.check_output(['git','-C',repo,'ls-tree','-r','--name-only',tree], text=True, errors='replace').splitlines()
              dirs=set()
              for raw in paths:
                  parent=pathlib.PurePosixPath(raw).parent
                  while str(parent) not in ('','.'):
                      dirs.add(str(parent)); parent=parent.parent
              entries=1+len(paths)+len(dirs)
              if entries!=288: continue
              code=sum(pathlib.PurePosixPath(p).suffix.lower() in code_ext for p in paths)
              js=sum(pathlib.PurePosixPath(p).suffix.lower() in {'.js','.jsx'} for p in paths)
              useful=sum(pathlib.PurePosixPath(p).suffix.lower() in code_ext|{'.md','.txt'} for p in paths)
              hits.append((commit,tree,entries,len(paths),useful,code,js))
          print(f'YIMINGHE unique_trees={len(seen)} exact_entry_trees={len(hits)}')
          for h in hits: print('YIMINGHE_MATCH sha=%s tree=%s entries=%s files=%s useful=%s code=%s js=%s'%h)
          PY

  cpp_mit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Discover C++ MIT source candidates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, subprocess, urllib.parse, urllib.request
          token=os.environ['GH_TOKEN']
          q='LeetCode-Solutions in:name language:C++ license:mit'
          req=urllib.request.Request('https://api.github.com/search/repositories?per_page=50&q='+urllib.parse.quote(q), headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'})
          items=json.load(urllib.request.urlopen(req))['items']
          plausible=[]
          for it in items:
              name=it['name'].casefold()
              if 'leetcode' not in name or 'solution' not in name or it.get('size',0)>3000: continue
              plausible.append((it['full_name'],it['clone_url'],it.get('size',0),it['default_branch']))
          print('CPP_CANDIDATES',len(plausible),plausible)
          for idx,(full,url,size,branch) in enumerate(plausible[:30]):
              repo=f'/tmp/cpp-{idx}'
              clone=subprocess.run(['git','clone','--quiet','--filter=blob:none',url,repo])
              if clone.returncode: continue
              rows=subprocess.check_output(['git','-C',repo,'log','--all','--before=2026-08-02T00:00:00Z','--format=%H %T'], text=True).splitlines()
              seen=set()
              for line in rows:
                  commit,tree=line.split()
                  if tree in seen: continue
                  seen.add(tree)
                  paths=subprocess.check_output(['git','-C',repo,'ls-tree','-r','--name-only',tree], text=True, errors='replace').splitlines()
                  dirs=set()
                  for raw in paths:
                      parent=pathlib.PurePosixPath(raw).parent
                      while str(parent) not in ('','.'):
                          dirs.add(str(parent)); parent=parent.parent
                  entries=1+len(paths)+len(dirs)
                  cpp=sum(pathlib.PurePosixPath(p).suffix.lower() in {'.cpp','.cc','.cxx','.c++'} for p in paths)
                  useful=sum(pathlib.PurePosixPath(p).suffix.lower() in {'.cpp','.cc','.cxx','.c++','.h','.hpp','.md','.txt'} for p in paths)
                  if entries==334 or cpp==108:
                      print(f'CPP_HIT repo={full} size={size} branch={branch} sha={commit} tree={tree} entries={entries} files={len(paths)} useful={useful} cpp={cpp}')
          PY

  competitive_programming:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        repository:
          - kothariji/competitive-programming
          - tmwilliamlin168/CompetitiveProgramming
          - abeaumont/competitive-programming
          - prasadgujar/CompetitiveProgramming
          - esbanarango/Competitive-Programming
          - Manwe56/competitive-programming
          - bqi343/cp-notebook
          - smv1999/CompetitiveProgrammingQuestionBank
    steps:
      - name: Scan candidate history
        shell: bash
        env:
          CANDIDATE: ${{ matrix.repository }}
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none "https://github.com/${CANDIDATE}.git" /tmp/repo
          python - <<'PY'
          import os, pathlib, subprocess
          full=os.environ['CANDIDATE']; repo='/tmp/repo'
          rows=subprocess.check_output(['git','-C',repo,'log','--all','--before=2026-08-02T00:00:00Z','--format=%H %T'], text=True).splitlines()
          seen=set(); hits=[]
          binary_ext={'.pdf','.zip','.rar','.7z','.exe','.out','.bin','.jpg','.jpeg','.png','.gif','.class'}
          useful_ext={'.cpp','.cc','.cxx','.c++','.c','.h','.hpp','.txt','.md','.py','.java'}
          for line in rows:
              commit,tree=line.split()
              if tree in seen: continue
              seen.add(tree)
              listing=subprocess.check_output(['git','-C',repo,'ls-tree','-r','-l',tree], text=True, errors='replace').splitlines()
              paths=[]; total_size=0
              for raw in listing:
                  parts=raw.split(None,4)
                  if len(parts)<5: continue
                  _,typ,_,blob_size,path=parts
                  if typ!='blob': continue
                  paths.append(path)
                  if blob_size.isdigit(): total_size += int(blob_size)
              dirs=set()
              for raw in paths:
                  parent=pathlib.PurePosixPath(raw).parent
                  while str(parent) not in ('','.'):
                      dirs.add(str(parent)); parent=parent.parent
              entries=1+len(paths)+len(dirs)
              cpp=sum(pathlib.PurePosixPath(p).suffix.lower() in {'.cpp','.cc','.cxx','.c++'} for p in paths)
              useful=sum(pathlib.PurePosixPath(p).suffix.lower() in useful_ext for p in paths)
              binaries=sum(pathlib.PurePosixPath(p).suffix.lower() in binary_ext for p in paths)
              if entries==470 or cpp==149:
                  hits.append((commit,tree,entries,len(paths),useful,cpp,binaries,total_size))
          print(f'CP_SCAN repo={full} unique_trees={len(seen)} hits={len(hits)}')
          for h in hits: print('CP_HIT repo=%s sha=%s tree=%s entries=%s files=%s useful=%s cpp=%s binaries=%s bytes=%s'%((full,)+h))
          PY
