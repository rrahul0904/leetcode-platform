name: Temporary source candidate scan

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript-candidates:
    name: JS candidate ${{ matrix.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        repository:
          - anusontarangkul/LeetCode-Solutions
          - tiagogodinho/leetcode-solutions
          - Jaysenso/leetcode-solutions
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Scan historical trees
        run: |
          repo='${{ matrix.repository }}'
          slug=${repo//\//-}
          python scripts/fingerprint_source_repository.py \
            --repository "https://github.com/${repo}.git" \
            --target-useful-files 222 \
            --target-code-files 210 \
            --target-language javascript \
            --before-date 2026-08-02 \
            --limit 8 \
            --output "/tmp/${slug}.json"
          cat "/tmp/${slug}.json"

  competitive-programming-candidates:
    name: CP candidate ${{ matrix.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        repository:
          - dolphingarlic/CompetitiveProgramming
          - risal-shefin/Competitive-Programming
          - yash0530/Competitive-Programming
          - proRamLOGO/Competitive_Programming
          - fishy15/competitive_programming
          - Aj163/Competitive-Programming
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Scan historical trees
        run: |
          repo='${{ matrix.repository }}'
          slug=${repo//\//-}
          python scripts/fingerprint_source_repository.py \
            --repository "https://github.com/${repo}.git" \
            --target-entries 470 \
            --target-useful-files 224 \
            --target-language cpp \
            --target-language-count 149 \
            --before-date 2026-08-02 \
            --limit 8 \
            --output "/tmp/${slug}.json"
          cat "/tmp/${slug}.json"
