name: Temporary release-agent repair

on:
  push:
    branches:
      - agent/source-backed-question-bank

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'Fix release-agent lint typing and imports'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/source-backed-question-bank
          fetch-depth: 0
      - name: Patch coordinator
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/source_bank_release_agents.py')
          text = path.read_text()

          text = text.replace(
              'from concurrent.futures import ThreadPoolExecutor\nfrom dataclasses import asdict, dataclass\nfrom pathlib import Path, PurePosixPath\nfrom typing import Mapping, Sequence, cast\n\ntry:\n',
              'from collections.abc import Mapping, Sequence\nfrom concurrent.futures import ThreadPoolExecutor\nfrom dataclasses import asdict, dataclass\nfrom pathlib import Path, PurePosixPath\nfrom typing import cast\n\nROOT = Path(__file__).resolve().parents[1]\nSCRIPTS_DIRECTORY = ROOT / "scripts"\nscripts_path = str(SCRIPTS_DIRECTORY)\nif scripts_path not in sys.path:\n    sys.path.insert(0, scripts_path)\n\ntry:\n',
          )
          text = text.replace(
              '\nROOT = Path(__file__).resolve().parents[1]\nSOURCE_DIRECTORY = ROOT / "content" / "imported" / "source-backed"\n',
              '\nSOURCE_DIRECTORY = ROOT / "content" / "imported" / "source-backed"\n',
              1,
          )

          marker = '''def _validate_run_submit_proof(\n    proof_path: Path,\n    *,\n    executable_packages: Sequence[str],\n) -> tuple[bool, dict[str, object], list[str]]:\n'''
          helper = '''def _proof_object(\n    proof: Mapping[str, object],\n    key: str,\n    blockers: list[str],\n) -> dict[str, object]:\n    raw = proof.get(key)\n    if not isinstance(raw, dict):\n        blockers.append(f"run_submit_proof.{key} must be an object")\n        return {}\n    return {\n        str(item_key): item_value\n        for item_key, item_value in cast(dict[object, object], raw).items()\n    }\n\n\n'''
          if helper not in text:
              if marker not in text:
                  raise SystemExit('run-submit validator marker missing')
              text = text.replace(marker, helper + marker, 1)

          old = '''    run = proof.get("run")\n    submit = proof.get("submit")\n    idempotency = proof.get("idempotency")\n    if not isinstance(run, dict):\n        blockers.append("run_submit_proof.run must be an object")\n        run = {}\n    if not isinstance(submit, dict):\n        blockers.append("run_submit_proof.submit must be an object")\n        submit = {}\n    if not isinstance(idempotency, dict):\n        blockers.append("run_submit_proof.idempotency must be an object")\n        idempotency = {}\n'''
          new = '''    run = _proof_object(proof, "run", blockers)\n    submit = _proof_object(proof, "submit", blockers)\n    idempotency = _proof_object(proof, "idempotency", blockers)\n'''
          if old not in text:
              raise SystemExit('typed proof object block missing')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit repair
        run: |
          if git diff --quiet -- scripts/source_bank_release_agents.py; then
            echo 'No repair required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/source_bank_release_agents.py
          git commit -m 'Fix release-agent lint typing and imports'
          git push origin HEAD:agent/source-backed-question-bank
