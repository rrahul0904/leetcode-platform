name: One-time imported execution gate

on:
  push:
    branches:
      - agent/question-bank-phases-0-6

permissions:
  contents: write

jobs:
  gate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/question-bank-phases-0-6
          fetch-depth: 0

      - name: Disable execution for raw imported solutions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/api/src/rigor_api/knowledge_store.py")
          text = path.read_text(encoding="utf-8")
          old = '''        executable = language in {"python", "javascript", "sql"} and disposition == SourceDisposition.HOSTABLE_LICENSED.value
'''
          new = '''        # A licensed source file is not an executable judge contract. Execution
        # remains disabled until a governed question package provides a reviewed
        # runtime, entrypoint, starter, public tests, hidden tests, limits, and
        # trusted expected outputs.
        executable = False
'''
          if old not in text:
              old = '''        executable = (
            language in {"python", "javascript", "sql"}
            and disposition == SourceDisposition.HOSTABLE_LICENSED.value
        )
'''
          if old not in text:
              raise SystemExit("Imported execution expression was not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install and format
        run: |
          uv sync --frozen --all-packages
          uv run ruff format apps/api/src/rigor_api/knowledge_store.py
          uv run ruff check --fix apps/api/src/rigor_api/knowledge_store.py

      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-execution-gate.yml

      - name: Commit execution gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Gate imported solutions from execution"
          git push origin HEAD:agent/question-bank-phases-0-6
