name: Dependency lockfile refresh (PR branch only)

on:
  push:
    branches:
      - feature/dual-mode-ai-interview-foundation-20261026
    paths:
      - apps/web/package.json
      - apps/mobile/package.json
      - .github/workflows/dependency-lock-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.ref == 'refs/heads/feature/dual-mode-ai-interview-foundation-20261026'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/dual-mode-ai-interview-foundation-20261026
          persist-credentials: true
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Configure pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.10.0"
      - name: Resolve and regenerate the reviewed dependency lockfile
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Commit generated lockfile (without bypassing release checks)
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix(lockfile): resolve patched Next.js and Zod dependency graph"
          git push origin HEAD:feature/dual-mode-ai-interview-foundation-20261026
