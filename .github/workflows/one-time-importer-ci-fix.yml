name: One-time importer CI fix

on:
  push:
    branches:
      - agent/source-backed-question-bank

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/source-backed-question-bank
          fetch-depth: 0

      - name: Patch importer and rebuilder defects
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          knowledge_path = Path("apps/api/src/rigor_api/knowledge_store.py")
          knowledge = knowledge_path.read_text(encoding="utf-8")
          old_sql = "jsonb_build_object('disposition', :disposition)"
          new_sql = "jsonb_build_object('disposition', CAST(:disposition AS text))"
          sql_count = knowledge.count(old_sql)
          if sql_count != 1:
              raise SystemExit(f"expected exactly one importer disposition bind, found {sql_count}")
          knowledge_path.write_text(knowledge.replace(old_sql, new_sql), encoding="utf-8")

          rebuild_path = Path("scripts/rebuild_source_backed_question_bank.py")
          rebuild = rebuild_path.read_text(encoding="utf-8")
          old_mismatches = "    mismatches = []\n"
          if rebuild.count(old_mismatches) != 1:
              raise SystemExit("expected exactly one untyped mismatches list")
          rebuild = rebuild.replace(
              old_mismatches,
              "    mismatches: list[str] = []\n",
          )
          old_help = (
              '        help="diagnostic only: validate manifest but do not require the reviewed '
              'normalized ZIP SHA-256",\n'
          )
          if rebuild.count(old_help) != 1:
              raise SystemExit("expected exactly one long skip-reviewed-sha help line")
          rebuild = rebuild.replace(
              old_help,
              '        help=(\n'
              '            "diagnostic only: validate manifest but do not require the reviewed "\n'
              '            "normalized ZIP SHA-256"\n'
              '        ),\n',
          )
          rebuild_path.write_text(rebuild, encoding="utf-8")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install workspace
        run: uv sync --frozen --all-packages

      - name: Format and lint touched Python
        run: |
          uv run ruff format \
            apps/api/src/rigor_api/knowledge_store.py \
            apps/api/tests/test_knowledge_store_idempotency.py \
            apps/api/tests/test_source_bank_reconstruction.py \
            scripts/rebuild_source_backed_question_bank.py
          uv run ruff check --fix \
            apps/api/src/rigor_api/knowledge_store.py \
            apps/api/tests/test_knowledge_store_idempotency.py \
            apps/api/tests/test_source_bank_reconstruction.py \
            scripts/rebuild_source_backed_question_bank.py
          uv run ruff check \
            apps/api/src/rigor_api/knowledge_store.py \
            apps/api/tests/test_knowledge_store_idempotency.py \
            apps/api/tests/test_source_bank_reconstruction.py \
            scripts/rebuild_source_backed_question_bank.py

      - name: Type-check source-bank rebuilder
        run: uv run pyright scripts/rebuild_source_backed_question_bank.py

      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-importer-ci-fix.yml

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix knowledge import idempotency and source-bank checks"
          git push origin HEAD:agent/source-backed-question-bank
