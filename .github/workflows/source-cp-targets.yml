name: Source CP targeted recovery

on:
  push:
    branches:
      - agent/source-backed-question-bank

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        repository:
          - abeaumont/competitive-programming
          - jimgao1/competitive-programming
          - cthbst/Competitive-Programming
          - pranjalwalia/Competitive-programming
          - esix/competitive-programming
          - claytonjwong/competitive-programming
          - risal-shefin/Competitive-Programming
          - Slava/competitiveProgramming
          - yash0530/Competitive-Programming
          - fepaf/Competitive-Programming
          - anirudhakulkarni/competitive-programming
          - Aj163/Competitive-Programming
          - KevinMathewT/Competitive-Programming
          - ay2306/Competitive-Programming
          - Spectrum-CETB/competitive-programming
    steps:
      - name: Scan historical trees
        shell: bash
        env:
          REPOSITORY: ${{ matrix.repository }}
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout "https://github.com/${REPOSITORY}.git" /tmp/repo
          python - <<'PY'
          import collections
          import os
          import pathlib
          import subprocess

          repo = "/tmp/repo"
          name = os.environ["REPOSITORY"]
          rows = subprocess.check_output(
              ["git", "-C", repo, "log", "--all", "--before=2026-08-02T00:00:00Z", "--format=%H %T"],
              text=True,
          ).splitlines()
          seen = set()
          hits = []
          for row in rows:
              commit, tree = row.split()
              if tree in seen:
                  continue
              seen.add(tree)
              paths = subprocess.check_output(
                  ["git", "-C", repo, "ls-tree", "-r", "--name-only", tree], text=True
              ).splitlines()
              dirs = set()
              ext = collections.Counter()
              for raw in paths:
                  path = pathlib.PurePosixPath(raw)
                  ext[path.suffix.lower() or "<none>"] += 1
                  parent = path.parent
                  while str(parent) not in ("", "."):
                      dirs.add(str(parent))
                      parent = parent.parent
              cpp = sum(ext[x] for x in (".cpp", ".cc", ".cxx", ".c++"))
              raw_entries = 1 + len(paths) + len(dirs)
              # The original upload inventory calls 224 files "useful" and explicitly
              # excludes PDFs/binaries. Report several transparent textual projections
              # rather than pretending all Git files are useful.
              source_text = sum(ext[x] for x in (".cpp", ".cc", ".cxx", ".c++", ".c", ".h", ".hpp", ".py", ".java", ".js", ".go", ".kt", ".cs", ".md", ".txt"))
              cpp_notes = cpp + ext[".md"] + ext[".txt"] + ext[".h"] + ext[".hpp"]
              if raw_entries == 470 or cpp == 149 or source_text == 224 or cpp_notes == 224:
                  summary = {
                      "repository": name,
                      "commit": commit,
                      "tree": tree,
                      "raw_entries": raw_entries,
                      "files": len(paths),
                      "dirs": len(dirs),
                      "cpp": cpp,
                      "source_text": source_text,
                      "cpp_notes": cpp_notes,
                      "pdf": ext[".pdf"],
                      "extensions": dict(sorted(ext.items())),
                  }
                  hits.append(summary)
                  print("CP_CANDIDATE", summary)
                  if raw_entries == 470 and cpp == 149:
                      print("CP_STRONG_MATCH", summary)
          print(f"CP_SUMMARY repository={name} unique_trees={len(seen)} candidates={len(hits)}")
          PY
