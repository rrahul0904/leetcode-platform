name: Source bank recovery diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve exact historical source snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .recovery/repos .recovery/archives .recovery/generated .recovery/scans

          archive_repo() {
            local url="$1" work="$2" root="$3" output="$4" sha="${5:-}"
            local dir=".recovery/repos/$work"
            if [ ! -d "$dir/.git" ]; then
              git clone --quiet "$url" "$dir"
            fi
            pushd "$dir" >/dev/null
            if [ -z "$sha" ]; then
              sha=$(git rev-list -1 --before='2026-08-02T00:00:00Z' HEAD)
            fi
            echo "SOURCE $output $url $sha"
            git archive --format=zip --prefix="$root/" "$sha" > "../../archives/$output"
            popd >/dev/null
          }

          archive_repo https://github.com/md-shamim-ahmad/LeetCode-Problem-Solution.git lc_problem LeetCode-Problem-Solution-main LeetCode-Problem-Solution-main.zip
          archive_repo https://github.com/withaarzoo/LeetCode-Solutions.git withaarzoo LeetCode-Solutions-main LeetCode-Solutions-main.zip
          archive_repo https://github.com/codedecks-in/LeetCode-Solutions.git codedecks LeetCode-Solutions-master 'LeetCode-Solutions-master (1).zip'
          archive_repo https://github.com/liquidslr/interview-company-wise-problems.git company_index leetcode-company-wise-problems-main leetcode-company-wise-problems-main.zip
          cp .recovery/archives/leetcode-company-wise-problems-main.zip '.recovery/archives/leetcode-company-wise-problems-main (1).zip'
          archive_repo https://github.com/snehasishroy/leetcode-companywise-interview-questions.git company_interview leetcode-companywise-interview-questions-master leetcode-companywise-interview-questions-master.zip
          archive_repo https://github.com/krishnadey30/LeetCode-Questions-CompanyWise.git company_large LeetCode-Questions-CompanyWise-master LeetCode-Questions-CompanyWise-master.zip
          archive_repo https://github.com/ashishps1/awesome-leetcode-resources.git awesome awesome-leetcode-resources-main awesome-leetcode-resources-main.zip
          archive_repo https://github.com/liquidslr/system-design-notes.git system_design system-design-notes-main system-design-notes-main.zip

          python - <<'PY'
          from pathlib import Path
          import zipfile
          for path in sorted(Path('.recovery/archives').glob('*.zip')):
              with zipfile.ZipFile(path) as zf:
                  print(f'KNOWN_ARCHIVE {path.name} entries={len(zf.infolist())} bytes={path.stat().st_size}')
          PY

          python scripts/build_uploaded_question_bank.py .recovery/archives/*.zip --output .recovery/generated

      - name: Verify known reconstruction and Python fingerprints
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from scripts.source_python_batch import load_python_candidates
          root = Path('.recovery/generated')
          manifest = json.loads((root / 'manifest.json').read_text())
          print('RECONSTRUCTED_MANIFEST=' + json.dumps(manifest, sort_keys=True))
          generated = [json.loads(x) for x in (root / 'hosted_question_candidates.jsonl').read_text().splitlines() if x.strip()]
          by_slug = {row.get('slug'): row for row in generated}
          embedded = load_python_candidates()
          matched = 0
          for expected in embedded:
              actual = by_slug.get(expected.get('slug'))
              if actual and hashlib.sha256(str(expected.get('reference_solution_code') or '').encode()).hexdigest() == hashlib.sha256(str(actual.get('reference_solution_code') or '').encode()).hexdigest():
                  matched += 1
          print(f'PYTHON_SOLUTION_FINGERPRINTS={matched}/{len(embedded)}')
          PY

      - name: Scan histories for exact uploaded archive entry counts
        shell: bash
        run: |
          set -euo pipefail
          scan_history() {
            local label="$1" url="$2" target="$3"
            local dir=".recovery/scans/$label"
            rm -rf "$dir"
            git clone --quiet "$url" "$dir" || { echo "SCAN clone_failed $label $url"; return; }
            python - "$label" "$dir" "$target" "$url" <<'PY'
          import subprocess, sys
          from pathlib import PurePosixPath

          label, repo, target_raw, url = sys.argv[1:]
          target = int(target_raw)
          cutoff = '2026-08-02T00:00:00Z'

          rows = subprocess.check_output(
              ['git', '-C', repo, 'log', '--all', f'--before={cutoff}', '--format=%H %T'],
              text=True,
          ).splitlines()
          seen = set()
          exact = []
          closest = []
          for row in rows:
              commit, tree = row.split()
              if tree in seen:
                  continue
              seen.add(tree)
              paths = subprocess.check_output(
                  ['git', '-C', repo, 'ls-tree', '-r', '--name-only', tree],
                  text=True,
                  errors='replace',
              ).splitlines()
              dirs = set()
              for raw in paths:
                  parent = PurePosixPath(raw).parent
                  while str(parent) not in ('', '.'):
                      dirs.add(str(parent))
                      parent = parent.parent
              entries = 1 + len(paths) + len(dirs)
              delta = abs(entries - target)
              closest.append((delta, entries, len(paths), commit, tree))
              if entries == target:
                  exact.append((commit, tree, len(paths)))
          closest.sort()
          print(f'SCAN {label} target={target} url={url} unique_trees={len(seen)}')
          for commit, tree, blobs in exact[:20]:
              print(f'EXACT {label} entries={target} blobs={blobs} sha={commit} tree={tree} url={url}')
          if not exact:
              for delta, entries, blobs, commit, tree in closest[:5]:
                  print(f'CLOSEST {label} entries={entries} delta={delta} blobs={blobs} sha={commit} tree={tree} url={url}')
          PY
          }

          scan_history js_dmitry https://github.com/DmitryNaimark/leetcode-solutions.git 288
          scan_history js_apsolut https://github.com/apsolut-javascript/LeetCode-Solutions.git 288
          scan_history js_nadim https://github.com/nadimtuhin/leetcode-solutions.git 288
          scan_history js_manthan https://github.com/manthanank/leetcode-solutions.git 288
          scan_history js_zhangxin https://github.com/zhangxin840/leetcode-solutions.git 288
          scan_history js_ifmos https://github.com/ifmos/leetcode-solutions.git 288
          scan_history js_zhangyuf https://github.com/zhangyuf00/LeetCode-Solutions.git 288

          scan_history cp_ashutosh https://github.com/ashutoshm1771/Competitive-Programming.git 470
          scan_history cp_yash https://github.com/yash0530/Competitive-Programming.git 470
          scan_history cp_kevin https://github.com/KevinMathewT/Competitive-Programming.git 470
          scan_history cp_om https://github.com/om-ashish-soni/Competitive-Programming.git 470
          scan_history cp_risal https://github.com/risal-shefin/Competitive-Programming.git 470
          scan_history cp_dolphin https://github.com/dolphingarlic/CompetitiveProgramming.git 470
          scan_history cp_aj https://github.com/Aj163/Competitive-Programming.git 470
          scan_history cp_pranjal https://github.com/pranjalwalia/Competitive-programming.git 470

          scan_history company_index https://github.com/liquidslr/interview-company-wise-problems.git 132
          scan_history company_interview https://github.com/snehasishroy/leetcode-companywise-interview-questions.git 403
          scan_history company_large https://github.com/krishnadey30/LeetCode-Questions-CompanyWise.git 3611
