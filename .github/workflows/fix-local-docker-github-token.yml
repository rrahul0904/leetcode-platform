name: Temporary local Docker GitHub API repair

on:
  push:
    branches:
      - agent/source-backed-question-bank

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'Authenticate local catalog GitHub metadata reads'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/source-backed-question-bank
          fetch-depth: 0
      - name: Patch authenticated metadata collection
        run: |
          python - <<'PY'
          from pathlib import Path

          collector = Path('scripts/collect_external_references.py')
          text = collector.read_text()
          old = '''class JsonClient:\n    def __init__(self, ca_file: str | None) -> None:\n        self.context = ssl.create_default_context(cafile=ca_file) if ca_file else None\n        if self.context is not None and hasattr(ssl, "VERIFY_X509_STRICT"):\n'''
          new = '''class JsonClient:\n    def __init__(\n        self,\n        ca_file: str | None,\n        github_token: str | None = None,\n    ) -> None:\n        self.context = ssl.create_default_context(cafile=ca_file) if ca_file else None\n        self.github_token = github_token or os.getenv("RIGOR_GITHUB_API_TOKEN")\n        if self.context is not None and hasattr(ssl, "VERIFY_X509_STRICT"):\n'''
          if old not in text:
              raise SystemExit('JsonClient constructor marker missing')
          text = text.replace(old, new, 1)

          old = '''    def get(self, url: str) -> dict[str, Any]:\n        request = Request(\n            url,\n            headers={"Accept": "application/json", "User-Agent": USER_AGENT},\n        )\n'''
          new = '''    def get(self, url: str) -> dict[str, Any]:\n        headers = {"Accept": "application/json", "User-Agent": USER_AGENT}\n        if self.github_token and url.startswith("https://api.github.com/"):\n            headers["Authorization"] = f"Bearer {self.github_token}"\n            headers["X-GitHub-Api-Version"] = "2022-11-28"\n        request = Request(url, headers=headers)\n'''
          if old not in text:
              raise SystemExit('JsonClient request marker missing')
          text = text.replace(old, new, 1)
          collector.write_text(text)

          compose = Path('compose.yaml')
          text = compose.read_text()
          marker = '''      RIGOR_DATABASE_URL: postgresql+psycopg://rigor_migrator:rigor_migrator_local_only@postgres:5432/rigor\n      PGOPTIONS: "-c rigor.maintenance_bypass=on"\n'''
          replacement = '''      RIGOR_DATABASE_URL: postgresql+psycopg://rigor_migrator:rigor_migrator_local_only@postgres:5432/rigor\n      RIGOR_GITHUB_API_TOKEN: ${RIGOR_GITHUB_API_TOKEN:-}\n      PGOPTIONS: "-c rigor.maintenance_bypass=on"\n'''
          # Only catalog and catalog-init should receive the token; they are the first
          # two matching maintenance-bypass service blocks after seed.
          first = text.find(marker, text.find('  catalog:\n'))
          if first < 0:
              raise SystemExit('catalog environment marker missing')
          text = text[:first] + text[first:].replace(marker, replacement, 1)
          second_start = text.find('  catalog-init:\n')
          second = text.find(marker, second_start)
          if second < 0:
              raise SystemExit('catalog-init environment marker missing')
          text = text[:second] + text[second:].replace(marker, replacement, 1)
          compose.write_text(text)

          workflow = Path('.github/workflows/local-docker.yml')
          text = workflow.read_text()
          old = '''  local-docker:\n    name: Clean bootstrap, execution health, backup, and restore\n    runs-on: ubuntu-latest\n    timeout-minutes: 45\n'''
          new = '''  local-docker:\n    name: Clean bootstrap, execution health, backup, and restore\n    runs-on: ubuntu-latest\n    timeout-minutes: 45\n    env:\n      RIGOR_GITHUB_API_TOKEN: ${{ github.token }}\n'''
          if old not in text:
              raise SystemExit('local Docker job marker missing')
          text = text.replace(old, new, 1)
          workflow.write_text(text)
          PY

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/collect_external_references.py compose.yaml .github/workflows/local-docker.yml
          if git diff --cached --quiet; then
            echo 'No repair required.'
            exit 0
          fi
          git commit -m 'Authenticate local catalog GitHub metadata reads'
          git push origin HEAD:agent/source-backed-question-bank
