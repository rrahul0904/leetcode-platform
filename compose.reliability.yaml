services:
  catalog-init:
    command:
      - sh
      - -ec
      - |
        attempt=1
        while [ "$${attempt}" -le 3 ]; do
          if python /app/scripts/collect_external_references.py --ca-file /run/secrets/build_ca; then
            exit 0
          fi
          echo "catalog collection attempt $${attempt}/3 failed" >&2
          sleep $$((attempt * 5))
          attempt=$$((attempt + 1))
        done
        exit 1

  execution-controller:
    environment:
      RIGOR_EXECUTION_LEASE_SECONDS: "10"
      RIGOR_EXECUTION_VISIBILITY_SECONDS: "15"
      RIGOR_EXECUTION_STALE_QUEUED_SECONDS: "30"
      RIGOR_EXECUTION_MAX_ATTEMPTS: "3"
      RIGOR_EXECUTION_POLL_SECONDS: "0.05"
      RIGOR_EXECUTION_RECONCILIATION_LIMIT: "100"

  execution-postgres:
    tmpfs:
      - /var/lib/postgresql:size=384m,mode=0700,uid=999,gid=999
