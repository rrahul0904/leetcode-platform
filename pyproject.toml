[project]
name = "rigor-platform"
version = "0.1.0"
description = "Rigor interview preparation platform Python workspace"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "hypothesis==6.157.1",
  "httpx2==2.7.0",
  "pyright==1.1.411",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.15.22",
]

[tool.uv.workspace]
members = ["apps/api", "packages/question-schema"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = [
  "apps/api/tests",
  "packages/question-schema/tests",
  "services/python-runner/tests",
  "tests",
]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["content"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["apps/api/src", "packages/question-schema/src", "scripts"]
extraPaths = ["apps/api/src", "packages/question-schema/src"]
