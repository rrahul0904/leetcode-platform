  - '@tanstack/react-query@5.101.3'
  - 'compression@1.8.2'
  - 'sharp@0.35.5'
  - 'shell-quote@1.11.0'
  - 'source-map-js@1.2.2'

onlyBuiltDependencies:
  - "sharp"
  - "unrs-resolver"

overrides:
  "nanoid@<3.3.18": 3.3.19
  "brace-expansion@1.1.16": 1.1.20
  "brace-expansion@2.1.2": 2.1.6
  "brace-expansion@5.0.7": 5.0.12
  "browserslist@4.28.6": 4.28.8
  "image-size@1.2.1": 2.0.3
  "js-yaml@<4.3.2": 4.3.2
  "compression@1.8.1": 1.8.2
  "sharp@0.35.4": 0.35.5
  "shell-quote@1.10.0": 1.11.0
  "source-map-js@1.2.1": 1.2.2
